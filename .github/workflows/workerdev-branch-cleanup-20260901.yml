name: WorkerDev branch cleanup 2026-09-01

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/workerdev-branch-cleanup-20260901.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify and delete exact stale branch refs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: sol-ai-agent
          DEFAULT_BRANCH: main
        shell: bash
        run: |
          set -Eeuo pipefail
          declare -A expected=(
            ["sol/autonomous-cognition-pulse-design-v0"]="c62080109d2c080d021ca4f7056b5f462a2cc89c"
            ["sol/autonomous-cognition-pulse-v0"]="d20b48440730e5d7136859b3e4b6f3ea01bee22d"
            ["sol/autonomous-provider-authority-design-v0"]="c47070deaadf7912da57b5af568289e41b4210ba"
            ["sol/autonomous-provider-fake-v0"]="3ef251516b66e1ba6410da85fe25ab4399a49732"
            ["sol/autonomous-provider-gate-v0"]="9141edb2bc721c358d6c2ad47e142eac16b440e9"
            ["sol/autonomous-pulse-provider-service-v0"]="6c03c096d6eae4acae40372de838e0d1eb069d51"
            ["sol/autonomous-pulse-runtime-gate"]="09c75f8be0db2a8355e548e23c295fe38547b57a"
            ["sol/autonomous-pulse-service-v0"]="b0091cffeaa8e2abd57bcc30894b5b50762021f2"
            ["sol/c8b0999-promotion-runbook"]="114c9d9eb429ee0af5716a9000ea3ab6f7f1a169"
            ["sol/current-cognition-real-gate"]="19db6e4d934813014d3fba49827a3bfd22555da6"
            ["sol/fedora44-common-build-env"]="b85ec172f5c6652ecf9fb16d667ec81cf7d4b657"
            ["sol/fedora44-podman-keep-id"]="c9390b08d2bf137d39fb4a7cfad9671c24c8084d"
            ["sol/pin-legacy-ci-fedora44"]="53db1dea02c6e0d12b5295471a94553cb748c341"
          )
          declare -A proof=(
            ["sol/autonomous-cognition-pulse-design-v0"]="merged"
            ["sol/autonomous-cognition-pulse-v0"]="merged"
            ["sol/autonomous-provider-authority-design-v0"]="merged"
            ["sol/autonomous-provider-fake-v0"]="merged"
            ["sol/autonomous-provider-gate-v0"]="merged"
            ["sol/autonomous-pulse-provider-service-v0"]="merged"
            ["sol/autonomous-pulse-runtime-gate"]="merged"
            ["sol/autonomous-pulse-service-v0"]="merged"
            ["sol/c8b0999-promotion-runbook"]="merged"
            ["sol/current-cognition-real-gate"]="merged"
            ["sol/fedora44-common-build-env"]="merged"
            ["sol/fedora44-podman-keep-id"]="merged"
            ["sol/pin-legacy-ci-fedora44"]="absorbed"
          )
          mapfile -t branches < <(printf '%s\n' "${!expected[@]}" | sort)
          deleted=()

          restore_deleted() {
            local branch
            set +e
            for branch in "${deleted[@]}"; do
              gh api -X POST "repos/$REPO/git/refs" \
                -f "ref=refs/heads/$branch" \
                -f "sha=${expected[$branch]}" >/dev/null
            done
          }
          on_exit() {
            local rc=$?
            if (( rc != 0 )); then
              restore_deleted
            fi
            exit "$rc"
          }
          trap on_exit EXIT

          for branch in "${branches[@]}"; do
            [[ "$branch" != "$DEFAULT_BRANCH" ]]
            current="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq .object.sha)"
            [[ "$current" == "${expected[$branch]}" ]]
            open_count="$(gh api -X GET "repos/$REPO/pulls" \
              -f state=open -f "head=$OWNER:$branch" -f per_page=100 --jq length)"
            [[ "$open_count" == 0 ]]

            if [[ "${proof[$branch]}" == merged ]]; then
              merged_count="$(gh api -X GET "repos/$REPO/pulls" \
                -f state=closed -f "head=$OWNER:$branch" -f per_page=100 |
                jq --arg sha "${expected[$branch]}" \
                  '[.[] | select(.head.sha == $sha and .merged_at != null)] | length')"
              [[ "$merged_count" -ge 1 ]]
            elif [[ "${proof[$branch]}" == absorbed ]]; then
              comparison="$(gh api "repos/$REPO/compare/$DEFAULT_BRANCH...${expected[$branch]}")"
              [[ "$(jq -r .ahead_by <<<"$comparison")" == 0 ]]
            else
              exit 91
            fi
          done

          for branch in "${branches[@]}"; do
            current="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq .object.sha)"
            [[ "$current" == "${expected[$branch]}" ]]
            gh api -X DELETE "repos/$REPO/git/refs/heads/$branch"
            deleted+=("$branch")
            printf 'DELETED %s %s %s\n' "$branch" "${expected[$branch]}" "${proof[$branch]}"
          done

          for branch in "${branches[@]}"; do
            if gh api "repos/$REPO/git/ref/heads/$branch" >/dev/null 2>&1; then
              exit 92
            fi
          done
          trap - EXIT
