name: Dialogue responder authority first dispatch

on:
  pull_request:
    paths:
      - 'src/local_goose_dialogue_responder_authority_first_dispatch_main.cpp'
      - 'Containerfile.responder-authority-first-dispatch'
      - '.github/workflows/dialogue-responder-authority-first-dispatch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority-first-dispatch-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prove first dispatch surface is exact and one-shot
        shell: bash
        run: |
          set -euo pipefail
          helper=src/local_goose_dialogue_responder_authority_first_dispatch_main.cpp
          containerfile=Containerfile.responder-authority-first-dispatch

          grep -Fq 'f82c3df882b60babea7d88a36589aad57d1f7b0b2b9ec4d208e8be8d01b71fae' "$helper"
          grep -Fq '72741315708884592db29c29c4e6c9d750b6e49f3b15a1bd1b61f9c1e618236b' "$helper"
          grep -Fq 'minimum_remaining_authority_ms = 2LL * 60 * 1000' "$helper"
          grep -Fq 'Sol reprend le dialogue depuis le point de continuite valide.' "$helper"
          grep -Fq '<inspect|dispatch-intent>' "$helper"
          grep -Fq 'dispatcher.dispatch(expected_intent_id)' "$helper"
          grep -Fq 'INTENT_STATE=completed' "$helper"
          grep -Fq 'DISPOSITION_STATE=completed' "$helper"
          grep -Fq 'LEASE_STATE=exhausted' "$helper"
          grep -Fq 'LEASE_TURNS_COMMITTED=1' "$helper"
          grep -Fq 'SEQUENCE4_ACK=yes' "$helper"
          grep -Fq 'HEAD_REVISION=4' "$helper"
          grep -Fq 'GAUDERE_DIALOGUE_RESPONDER_AUTHORITY_FIRST_DISPATCH=PASS' "$helper"

          ! grep -Fq 'prepare_decision(' "$helper"
          ! grep -Fq 'bind_decision(' "$helper"
          ! grep -Fq 'prepare_grant(' "$helper"
          ! grep -Fq 'activate_grant(' "$helper"
          ! grep -Fq 'dispatcher.prepare(' "$helper"
          ! grep -Fq 'create_lease(' "$helper"
          ! grep -Fq 'revoke_lease(' "$helper"

          grep -Fq 'io.gaudere.role="dialogue-responder-authority-first-dispatch-v1"' "$containerfile"
          grep -Fq '<inspect|dispatch-intent>' "$containerfile"

  fedora-44-helper-build:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install build dependencies
        run: >-
          dnf install -y autoconf automake diffutils gcc-c++ git json-devel
          libcurl-devel libtool make pkgconf-pkg-config sqlite-devel

      - uses: actions/checkout@v4

      - name: Build pinned core
        shell: bash
        run: |
          set -euo pipefail
          core_ref=$(tr -d '\r\n' < gaudere.ref)
          git clone https://github.com/sol-ai-agent/gaudere.git /tmp/gaudere
          git -C /tmp/gaudere checkout --detach "$core_ref"
          cd /tmp/gaudere
          autoreconf --install --force
          mkdir build
          cd build
          ../configure --prefix=/tmp/gaudere-install CXXFLAGS='-O2 -Wall -Wextra -Wpedantic -Werror'
          make --jobs=2 check
          make install

      - name: Compile confined first-dispatch helper
        shell: bash
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH=/tmp/gaudere-install/lib/pkgconfig
          export LD_LIBRARY_PATH=/tmp/gaudere-install/lib
          cflags="$(pkg-config --cflags gaudere-persistence-sqlite nlohmann_json)"
          libs="$(pkg-config --libs gaudere-persistence-sqlite nlohmann_json)"
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            ${cflags} -Isrc \
            src/local_goose_dialogue_responder_authority_first_dispatch_main.cpp \
            src/LocalGooseDialogueResponderAuthorityStore.cpp \
            src/LocalGooseDialogueResponderAuthority.cpp \
            src/LocalGooseDialogueResponderDispatcher.cpp \
            src/LocalGooseDialoguePreferredSubmitter.cpp \
            src/LocalGooseDialogueResponderStore.cpp \
            src/LocalGooseDialogueResponder.cpp \
            src/LocalGooseDialogueCompletionFeed.cpp \
            src/LocalGooseDialogueThreadStore.cpp \
            src/LocalGooseDialogueV2.cpp \
            src/LocalGooseDialogueV3.cpp \
            src/Sha256.cpp \
            -o /tmp/authority-first-dispatch \
            ${libs} -lsqlite3
          help_output=$(/tmp/authority-first-dispatch --help)
          printf '%s\n' "$help_output"
          printf '%s\n' "$help_output" | grep -Fq '<inspect|dispatch-intent>'
          ! printf '%s\n' "$help_output" | grep -Eq 'prepare-decision|bind-decision|grant|activate'
