name: Autonomous cognition provider gate proof

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fedora-44-autonomous-provider-gate:
    runs-on: ubuntu-latest
    container: fedora:44

    steps:
      - name: Install build dependencies
        run: >
          dnf install -y
          autoconf
          automake
          gcc-c++
          git
          json-devel
          libtool
          make
          pkgconf-pkg-config
          sqlite-devel

      - uses: actions/checkout@v4
        with:
          path: agent
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: sol-ai-agent/gaudere
          path: gaudere
          fetch-depth: 0

      - name: Pin Gaudere dependency
        run: |
          set -eu
          gaudere_ref=$(tr -d '\r\n' < agent/gaudere.ref)
          case "$gaudere_ref" in
            *[!0-9a-f]*|'') exit 1 ;;
          esac
          test "${#gaudere_ref}" -eq 40
          git -C gaudere checkout --detach "$gaudere_ref"
          test "$(git -C gaudere rev-parse HEAD)" = "$gaudere_ref"

      - name: Build and install Gaudere
        run: |
          set -eu
          cd gaudere
          autoreconf --install --force
          mkdir build
          cd build
          ../configure --prefix="$GITHUB_WORKSPACE/prefix" \
            CXXFLAGS="-O2 -Wall -Wextra -Wpedantic -Werror"
          make --jobs=2 check
          make install

      - name: Prove gate remains isolated and read-only
        run: |
          set -eu
          grep -q 'AutonomousCognitionProviderGate' agent/src/AutonomousCognitionProviderGate.hpp
          grep -q 'SQLITE_OPEN_READONLY' agent/src/AutonomousCognitionProviderGate.cpp
          grep -q 'LIMIT 2' agent/src/AutonomousCognitionProviderGate.cpp
          grep -q 'current_cognition_max_snapshot_age' agent/src/AutonomousCognitionProviderGate.cpp
          grep -q 'budget_store_.snapshot' agent/src/AutonomousCognitionProviderGate.cpp
          grep -q 'find_by_idempotency_key' agent/src/AutonomousCognitionProviderGate.cpp
          grep -q 'valid_current_cognition_task' agent/src/CurrentCognitionTaskInspection.cpp
          grep -q 'provider rolling-window budget is exhausted' \
            agent/src/AutonomousCognitionProviderGate.cpp
          ! grep -Eq 'ProviderTaskHandler|OpenAIActivation|OpenAIStructuredActivation|CurlHttpTransport|SecretSource|provider_.invoke' \
            agent/src/AutonomousCognitionProviderGate.cpp \
            agent/src/AutonomousCognitionProviderGate.hpp \
            agent/src/CurrentCognitionTaskInspection.cpp \
            agent/src/CurrentCognitionTaskInspection.hpp \
            agent/tests/autonomous_cognition_provider_gate_test.cpp
          ! grep -R -q -- '--autonomous-pulse-provider' agent/deploy/quadlet
          test "$(tr -d '\r\n' < agent/gaudere.ref)" = \
            '1316cf68db93e4c91a7bd79fbd289b8f382f8659'

      - name: Compile provider-free selector proof
        run: |
          set -eu
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/prefix/lib/pkgconfig"
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            -Iagent/src $(pkg-config --cflags gaudere-persistence-sqlite gaudere) \
            agent/tests/autonomous_cognition_provider_gate_test.cpp \
            agent/src/AutonomousCognitionProviderGate.cpp \
            agent/src/AutonomousCognitionPulseStore.cpp \
            agent/src/CurrentCognitionTaskInspection.cpp \
            agent/src/CurrentCognitionCycle.cpp \
            agent/src/ResumeContextSnapshot.cpp \
            agent/src/ResumeContextSnapshotInspection.cpp \
            agent/src/Sha256.cpp \
            agent/src/TaskExecutor.cpp \
            $(pkg-config --libs gaudere-persistence-sqlite gaudere) -lsqlite3 \
            -o /tmp/autonomous-cognition-provider-gate-test

      - name: Run provider-free selector proof
        run: |
          set -eu
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/prefix/lib"
          /tmp/autonomous-cognition-provider-gate-test
