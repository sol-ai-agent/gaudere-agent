name: OpenAI service config

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate static service boundaries
        run: |
          set -eu
          sh scripts/validate-openai-service-config.sh
          sh -n scripts/install-openai-user-service.sh
          sh -n scripts/validate-openai-service-capability.sh

      - name: Exercise schema-v3/v4 recovery compatibility
        run: |
          set -eu
          sh tests/openai_installer_schema_compatibility_test.sh

      - name: Exercise stopped-state activation fence
        run: |
          set -eu
          workspace=$(mktemp -d)
          trap 'rm -rf "$workspace"' EXIT
          fakebin="$workspace/bin"
          config_home="$workspace/config"
          data_home="$workspace/data"
          state="$data_home/gaudere/state"
          mkdir -p "$fakebin" "$state"

          cat > "$fakebin/podman" <<'SH'
          #!/bin/sh
          if [ "$1" = "image" ] && [ "$2" = "exists" ]; then exit 0; fi
          if [ "$1" = "run" ]; then
              if [ "${GAUDERE_FAKE_OLD_IMAGE:-0}" = "1" ]; then
                  printf 'Usage: gaudere-control --socket PATH [echo ID TEXT | openai ID TEXT | task ID | budget]\n' >&2
              else
                  printf 'Usage: gaudere-control --socket PATH [echo ID TEXT | openai ID TEXT | reflect ID OBJECTIVE | task ID | budget]\n' >&2
              fi
              exit 2
          fi
          if [ "$1" = "secret" ] && [ "$2" = "exists" ]; then exit 0; fi
          exit 99
          SH
          chmod +x "$fakebin/podman"

          cat > "$fakebin/systemctl" <<'SH'
          #!/bin/sh
          if [ "$1" = "--user" ] && [ "$2" = "is-active" ]; then
              printf 'inactive\n'
              exit 3
          fi
          if [ "$1" = "--user" ] && [ "$2" = "daemon-reload" ]; then exit 0; fi
          exit 99
          SH
          chmod +x "$fakebin/systemctl"

          python3 - "$state/state.db" <<'PY'
          import sqlite3, sys
          with sqlite3.connect(sys.argv[1]) as db:
              db.executescript("""
              PRAGMA user_version=3;
              CREATE TABLE tasks (id TEXT, kind TEXT, status INTEGER);
              """)
          PY

          PATH="$fakebin:$PATH" \
          XDG_CONFIG_HOME="$config_home" XDG_DATA_HOME="$data_home" \
          sh scripts/install-openai-user-service.sh > "$workspace/install.out"
          cat "$workspace/install.out"
          cmp deploy/quadlet/gaudere-agent-openai.container.in \
              "$config_home/containers/systemd/gaudere-agent.container"
          grep -q 'no provider task was submitted and the service remains stopped' \
              "$workspace/install.out"

          if GAUDERE_FAKE_OLD_IMAGE=1 PATH="$fakebin:$PATH" \
              XDG_CONFIG_HOME="$config_home" XDG_DATA_HOME="$data_home" \
              sh scripts/install-openai-user-service.sh \
              > "$workspace/old-image.out" 2> "$workspace/old-image.err"; then
              echo 'installer unexpectedly accepted a pre-reflection image' >&2
              exit 1
          fi
          cat "$workspace/old-image.err"
          grep -q 'runtime image predates bounded reflection' \
              "$workspace/old-image.err"

          python3 - "$state/state.db" <<'PY'
          import sqlite3, sys
          with sqlite3.connect(sys.argv[1]) as db:
              db.execute(
                  "INSERT INTO tasks(id,kind,status) VALUES(?,?,?)",
                  ("old-provider", "provider.openai.responses", 0),
              )
          PY

          if PATH="$fakebin:$PATH" \
              XDG_CONFIG_HOME="$config_home" XDG_DATA_HOME="$data_home" \
              sh scripts/install-openai-user-service.sh \
              > "$workspace/blocked.out" 2> "$workspace/blocked.err"; then
              echo 'installer unexpectedly accepted inherited provider work' >&2
              exit 1
          fi
          cat "$workspace/blocked.err"
          grep -q 'pre-existing nonterminal provider task requires review' \
              "$workspace/blocked.err"

          python3 - "$state/state.db" <<'PY'
          import sqlite3, sys
          with sqlite3.connect(sys.argv[1]) as db:
              db.execute("DELETE FROM tasks WHERE id='old-provider'")
              db.execute(
                  "INSERT INTO tasks(id,kind,status) VALUES(?,?,?)",
                  ("old-reflection", "cognition.reflect.v1", 0),
              )
          PY

          if PATH="$fakebin:$PATH" \
              XDG_CONFIG_HOME="$config_home" XDG_DATA_HOME="$data_home" \
              sh scripts/install-openai-user-service.sh \
              > "$workspace/reflection-blocked.out" \
              2> "$workspace/reflection-blocked.err"; then
              echo 'installer unexpectedly accepted inherited reflection work' >&2
              exit 1
          fi
          cat "$workspace/reflection-blocked.err"
          grep -q 'pre-existing nonterminal provider task requires review before activation: old-reflection:0' \
              "$workspace/reflection-blocked.err"
