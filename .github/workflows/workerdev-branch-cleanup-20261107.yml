branch":"sol/retry-admission-isolated-helper-v1","sha":"a257138f2cc16596d00f85ebb03f8c24f47b35b3","pr":267},{"branch":"sol/retry-authority-post-admission-contract-v1","sha":"bd07e2a473db5cae68aed341f52f0c5f5bed9903","pr":270},{"branch":"sol/retry-eligibility-readonly-v1","sha":"2283b402adff0152be0b10acf26b042ad66ad89c","pr":271},{"branch":"sol/retry-store-explicit-readonly-v1","sha":"42dd01d7c2a3404e198369ca5d13c70630b13b1d","pr":272}]''')
          repository = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          if repository != expected_repository:
              raise SystemExit(f"unexpected repository: {repository}")

          base = f"https://api.github.com/repos/{repository}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "workerdev-branch-cleanup",
          }

          def api(path, method="GET"):
              req = urllib.request.Request(base + path, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read()
                      return json.loads(body) if body else None
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")
                  raise RuntimeError(f"{method} {path}: HTTP {exc.code}: {body}") from exc

          open_pulls = api("/pulls?state=open&per_page=100")
          open_heads = {item["head"]["ref"] for item in open_pulls}

          verified = []
          for item in candidates:
              branch = item["branch"]
              if branch == "main" or branch in open_heads:
                  raise RuntimeError(f"protected branch selected: {branch}")
              encoded = urllib.parse.quote(branch, safe="/")
              ref = api("/git/ref/heads/" + encoded)
              actual_sha = ref["object"]["sha"]
              if actual_sha != item["sha"]:
                  raise RuntimeError(
                      f"SHA changed for {branch}: expected {item['sha']}, got {actual_sha}"
                  )
              pull = api(f"/pulls/{item['pr']}")
              checks = (
                  pull["state"] == "closed",
                  pull["merged_at"] is not None,
                  pull["head"]["ref"] == branch,
                  pull["head"]["sha"] == item["sha"],
                  pull["base"]["ref"] == "main",
              )
              if not all(checks):
                  raise RuntimeError(f"merged PR proof failed for {branch} / PR #{item['pr']}")
              verified.append((branch, encoded))

          print(f"Validated {len(verified)} branches; deletion starts.")
          for branch, encoded in verified:
              api("/git/refs/heads/" + encoded, method="DELETE")
              print(f"DELETED {branch}")
          print(f"PASS deleted={len(verified)}")
          PY
