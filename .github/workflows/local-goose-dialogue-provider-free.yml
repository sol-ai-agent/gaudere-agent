      - name: Build and run dialogue tests
        run: |
          set -eu
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/prefix/lib/pkgconfig"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/prefix/lib"
          cd agent
          autoreconf --install --force
          mkdir build-dialogue
          cd build-dialogue
          ../configure CXXFLAGS="-O2 -Wall -Wextra -Wpedantic -Werror"
          make --jobs=2 -C src gaudere-agent gaudere-control gaudere-local-goose-dialogue-proof gaudere-local-goose-dialogue-v2-proof gaudere-local-goose-dialogue-v3-proof
          make --jobs=2 -C tests \
            local_goose_dialogue_test \
            local_goose_dialogue_v2_test \
            local_goose_dialogue_v3_test \
            local_goose_dialogue_v3_handler_test \
            local_goose_dialogue_thread_store_test \
            local_goose_dialogue_completion_feed_test \
            local_goose_dialogue_v2_handler_test \
            local_goose_dialogue_handler_test \
            live_control_test \
            live_control_processor_test
          test -x src/gaudere-agent
          test -x src/gaudere-control
          control_help_status=0
          control_help=$(src/gaudere-control --help 2>&1) || control_help_status=$?
          test "$control_help_status" = "2"
          printf '%s\n' "$control_help" | grep -q 'local-message'
          printf '%s\n' "$control_help" | grep -q 'local-thread-start'
          printf '%s\n' "$control_help" | grep -q 'local-thread-next'
          printf '%s\n' "$control_help" | grep -q 'local-thread-v3-start'
          printf '%s\n' "$control_help" | grep -q 'local-thread-v3-next'
          printf '%s\n' "$control_help" | grep -q 'local-thread-v3-bind'
          printf '%s\n' "$control_help" | grep -q 'local-thread-v3-head'
          printf '%s\n' "$control_help" | grep -q 'local-thread-v3-send'
          grep -q 'control_help_status=0' ../scripts/deploy-local-goose-dialogue-v2-production.sh
          grep -q 'control usage probe returned unexpected status' ../scripts/deploy-local-goose-dialogue-v2-production.sh
          test -x src/gaudere-local-goose-dialogue-proof
          test -x src/gaudere-local-goose-dialogue-v2-proof
          test -x src/gaudere-local-goose-dialogue-v3-proof
          src/gaudere-local-goose-dialogue-proof --help 2>&1 | grep -q -- '--model-sha256'
          src/gaudere-local-goose-dialogue-v2-proof --help 2>&1 | grep -q -- '--model-sha256'
          src/gaudere-local-goose-dialogue-v3-proof --help 2>&1 | grep -q -- '--thread-sidecar'
          src/gaudere-local-goose-dialogue-v3-proof --help 2>&1 | grep -q -- '--completion-sidecar'
          src/gaudere-local-goose-dialogue-v3-proof --help 2>&1 | grep -q -- '--expected-tasks'
          sh -n ../scripts/prove-local-goose-dialogue-v2-fedora.sh
          grep -q -- '--network none' ../scripts/prove-local-goose-dialogue-v2-fedora.sh
          grep -q 'PRODUCTION_V2_DIALOGUE_TASKS' ../scripts/prove-local-goose-dialogue-v2-fedora.sh
          grep -q 'FEDORA_LOCAL_GOOSE_DIALOGUE_V2_ISOLATED=PASS' ../scripts/prove-local-goose-dialogue-v2-fedora.sh
          grep -q 'gaudere-local-goose-dialogue-v2-proof' ../Containerfile
          sh -n ../scripts/prove-local-goose-dialogue-v3-fedora.sh
          grep -q -- '--network none' ../scripts/prove-local-goose-dialogue-v3-fedora.sh
          grep -q '95660bd47c52de5bbac298047055f6b390018c6f86bee7457e59a88d18f0e3b6' ../scripts/prove-local-goose-dialogue-v3-fedora.sh
          grep -q 'LOCAL_GOOSE_DIALOGUE_V3_TASKS' ../scripts/prove-local-goose-dialogue-v3-fedora.sh
          grep -q 'local-thread-v3-bind' ../scripts/prove-local-goose-dialogue-v3-fedora.sh
          grep -q 'local-thread-v3-send' ../scripts/prove-local-goose-dialogue-v3-fedora.sh
          grep -q 'preferred dialogue thread revision conflict' ../scripts/prove-local-goose-dialogue-v3-fedora.sh
          grep -q 'local_goose_dialogue_completion_event' ../scripts/prove-local-goose-dialogue-v3-fedora.sh
          grep -q 'FEDORA_LOCAL_GOOSE_DIALOGUE_V3_MULTI_ACTOR_ISOLATED=PASS' ../scripts/prove-local-goose-dialogue-v3-fedora.sh
          grep -q 'gaudere-local-goose-dialogue-v3-proof' ../Containerfile
          tests/local_goose_dialogue_test | grep -Fx 'local_goose_dialogue_test: PASS'
          tests/local_goose_dialogue_v2_test | grep -Fx 'local_goose_dialogue_v2_test: PASS'
          tests/local_goose_dialogue_v3_test | grep -Fx 'local_goose_dialogue_v3_test: PASS'
          tests/local_goose_dialogue_v3_handler_test | grep -Fx 'local_goose_dialogue_v3_handler_test: PASS'
          tests/local_goose_dialogue_thread_store_test | grep -Fx 'local_goose_dialogue_thread_store_test: PASS'
          tests/local_goose_dialogue_completion_feed_test | grep -Fx 'local_goose_dialogue_completion_feed_test: PASS'
          tests/local_goose_dialogue_v2_handler_test | grep -Fx 'local_goose_dialogue_v2_handler_test: PASS'
          tests/local_goose_dialogue_handler_test | grep -Fx 'local_goose_dialogue_handler_test: PASS'
          tests/live_control_test
          tests/live_control_processor_test | grep -Fx 'All live control processor tests passed'
