name: Local Goose dialogue provider-free gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fedora-44-local-goose-dialogue:
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 30

    steps:
      - name: Install build dependencies
        run: >
          dnf install -y
          autoconf
          automake
          gcc-c++
          git
          json-devel
          libcurl-devel
          libtool
          make
          pkgconf-pkg-config
          sqlite-devel

      - uses: actions/checkout@v4
        with:
          path: agent
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: sol-ai-agent/gaudere
          path: gaudere
          fetch-depth: 0

      - name: Build pinned Gaudere core
        run: |
          set -eu
          gaudere_ref=$(tr -d '\r\n' < agent/gaudere.ref)
          git -C gaudere checkout --detach "$gaudere_ref"
          cd gaudere
          autoreconf --install --force
          mkdir build
          cd build
          ../configure --prefix="$GITHUB_WORKSPACE/prefix" \
            CXXFLAGS="-O2 -Wall -Wextra -Wpedantic -Werror"
          make --jobs=2
          make install

      - name: Prove dialogue authority boundary and production wiring
        run: |
          set -eu
          grep -q 'cognition.local-goose-dialogue.v1' agent/src/LocalGooseDialogue.hpp
          grep -q 'application/vnd.gaudere.local-goose-dialogue+json' agent/src/LocalGooseDialogue.hpp
          grep -q 'message_sha256' agent/src/LocalGooseDialogue.cpp
          grep -q 'model_sha256' agent/src/LocalGooseDialogue.cpp
          ! grep -Eq 'OpenAI|CurlHttpTransport|SecretSource|ProviderTaskHandler|LiveControl|LocalGooseRunner' \
            agent/src/LocalGooseDialogue.cpp agent/src/LocalGooseDialogue.hpp
          ! grep -Eq '(^|[^[:alnum:]_])(system|popen)[[:space:]]*\(' \
            agent/src/LocalGooseDialogue.cpp

          grep -q 'LocalGooseRunner' agent/src/LocalGooseDialogueHandler.hpp
          grep -q 'tools_enabled = false' agent/src/LocalGooseDialogueHandler.cpp
          grep -q 'control_socket.clear' agent/src/LocalGooseDialogueHandler.cpp
          grep -q 'governance_path.clear' agent/src/LocalGooseDialogueHandler.cpp
          ! grep -Eq 'OpenAI|CurlHttpTransport|SecretSource|ProviderTaskHandler|LiveControl|systemctl|podman' \
            agent/src/LocalGooseDialogueHandler.cpp agent/src/LocalGooseDialogueHandler.hpp
          ! grep -Eq '(^|[^[:alnum:]_])(system|popen)[[:space:]]*\(' \
            agent/src/LocalGooseDialogueHandler.cpp

          grep -q '#include "LocalGooseDialogueHandler.hpp"' agent/src/main.cpp
          grep -q 'local_goose_dialogue_runner' agent/src/main.cpp
          grep -q 'local_goose_dialogue_handler' agent/src/main.cpp
          grep -q 'local_goose_dialogue_task_kind' agent/src/main.cpp
          grep -q 'cannot register Local Goose dialogue handler' agent/src/main.cpp
          grep -q 'tools_enabled=false provider=local' agent/src/main.cpp
          grep -q 'options.local_goose_model_sha256' agent/src/main.cpp
          grep -q 'local-message' agent/src/control_main.cpp
          grep -q 'submit_local_goose_dialogue' agent/src/LiveControl.cpp
          grep -q 'make_local_goose_dialogue_task' agent/src/LiveControlProcessor.cpp
          grep -q 'request id conflicts' agent/src/LiveControlProcessor.cpp

          grep -q 'cognition.local-goose-dialogue.v2' agent/src/LocalGooseDialogueV2.hpp
          grep -q 'application/vnd.gaudere.local-goose-dialogue-v2+json' agent/src/LocalGooseDialogueV2.hpp
          grep -q 'predecessor_result_sha256' agent/src/LocalGooseDialogueV2.cpp
          grep -q 'turn_index' agent/src/LocalGooseDialogueV2.cpp
          grep -q 'root_task_id' agent/src/LocalGooseDialogueV2.cpp
          grep -q 'canonical_local_goose_dialogue_v2_success' agent/src/LocalGooseDialogueV2.cpp
          ! grep -Eq 'OpenAI|CurlHttpTransport|SecretSource|ProviderTaskHandler|LiveControl|LocalGooseRunner|systemctl|podman' \
            agent/src/LocalGooseDialogueV2.cpp agent/src/LocalGooseDialogueV2.hpp
          ! grep -Eq '(^|[^[:alnum:]_])(system|popen)[[:space:]]*\(' \
            agent/src/LocalGooseDialogueV2.cpp
          grep -q '#include "LocalGooseDialogueV2Handler.hpp"' agent/src/main.cpp
          grep -q 'local_goose_dialogue_v2_handler' agent/src/main.cpp
          grep -q 'local_goose_dialogue_v2_task_kind' agent/src/main.cpp
          grep -q 'cannot register Local Goose dialogue v2 handler' agent/src/main.cpp
          grep -q 'bounded_history=true' agent/src/main.cpp
          grep -q 'local-thread-start' agent/src/control_main.cpp
          grep -q 'local-thread-next' agent/src/control_main.cpp
          grep -q 'submit_local_goose_dialogue_v2_root' agent/src/LiveControl.cpp
          grep -q 'submit_local_goose_dialogue_v2_next' agent/src/LiveControl.cpp
          grep -q 'predecessor_task_id' agent/src/LiveControl.hpp
          grep -q 'make_local_goose_dialogue_v2_root_task' agent/src/LiveControlProcessor.cpp
          grep -q 'make_local_goose_dialogue_v2_successor_task' agent/src/LiveControlProcessor.cpp
          grep -q 'predecessor Task not found' agent/src/LiveControlProcessor.cpp

          grep -q 'LocalGooseDialogueV2Handler' agent/src/LocalGooseDialogueV2Handler.hpp
          grep -q 'LocalGooseDialogueV2Handler' agent/src/local_goose_dialogue_v2_proof_main.cpp
          grep -q 'context_bound_self_check=pass' agent/src/local_goose_dialogue_v2_proof_main.cpp
          grep -q 'tools_enabled = false' agent/src/LocalGooseDialogueV2Handler.cpp
          grep -q 'control_socket.clear' agent/src/LocalGooseDialogueV2Handler.cpp
          grep -q 'governance_path.clear' agent/src/LocalGooseDialogueV2Handler.cpp
          grep -q 'max_history_turns = 6' agent/src/LocalGooseDialogueV2Handler.cpp
          grep -q 'max_history_bytes = 40 \* 1024' agent/src/LocalGooseDialogueV2Handler.cpp
          grep -q 'max_prompt_bytes = 48 \* 1024' agent/src/LocalGooseDialogueV2Handler.cpp
          grep -q 'max_lineage_depth = 4096' agent/src/LocalGooseDialogueV2Handler.cpp
          ! grep -Eq 'OpenAI|CurlHttpTransport|SecretSource|ProviderTaskHandler|LiveControl|systemctl|podman' \
            agent/src/LocalGooseDialogueV2Handler.cpp agent/src/LocalGooseDialogueV2Handler.hpp
          ! grep -Eq '(^|[^[:alnum:]_])(system|popen)[[:space:]]*\(' \
            agent/src/LocalGooseDialogueV2Handler.cpp
          grep -q 'LocalGooseDialogueV2Handler' agent/src/main.cpp

          grep -q 'cognition.local-goose-dialogue.v3' agent/src/LocalGooseDialogueV3.hpp
          grep -q 'speaker_kind' agent/src/LocalGooseDialogueV3.cpp
          grep -q 'speaker_id' agent/src/LocalGooseDialogueV3.cpp
          grep -q 'message_kind' agent/src/LocalGooseDialogueV3.cpp
          grep -q 'make_local_goose_dialogue_v3_bridge_from_v2_task' agent/src/LocalGooseDialogueV3.cpp
          grep -q 'canonical_local_goose_dialogue_v2_success' agent/src/LocalGooseDialogueV3.cpp
          grep -q 'canonical_local_goose_dialogue_v3_success' agent/src/LocalGooseDialogueV3.cpp
          ! grep -Eq 'OpenAI|CurlHttpTransport|SecretSource|ProviderTaskHandler|LiveControl|LocalGooseRunner|systemctl|podman' \
            agent/src/LocalGooseDialogueV3.cpp agent/src/LocalGooseDialogueV3.hpp
          ! grep -Eq '(^|[^[:alnum:]_])(system|popen)[[:space:]]*\(' \
            agent/src/LocalGooseDialogueV3.cpp
          ! grep -q 'LocalGooseDialogueV3' agent/src/main.cpp
          grep -q 'submit_local_goose_dialogue_v3_root' agent/src/LiveControl.cpp
          grep -q 'submit_local_goose_dialogue_v3_next' agent/src/LiveControl.cpp
          grep -q 'speaker_kind' agent/src/LiveControl.cpp
          grep -q 'message_kind' agent/src/LiveControl.cpp
          grep -q 'make_local_goose_dialogue_v3_root_task' agent/src/LiveControlProcessor.cpp
          grep -q 'make_local_goose_dialogue_v3_bridge_from_v2_task' agent/src/LiveControlProcessor.cpp
          grep -q 'make_local_goose_dialogue_v3_successor_task' agent/src/LiveControlProcessor.cpp
          grep -q 'local-thread-v3-start' agent/src/control_main.cpp
          grep -q 'local-thread-v3-next' agent/src/control_main.cpp
          grep -q 'LocalGooseDialogueThreadStore' agent/src/LocalGooseDialogueThreadStore.hpp
          grep -q 'compare-and-swap' agent/src/LocalGooseDialogueThreadStore.hpp
          grep -q 'BEGIN IMMEDIATE' agent/src/LocalGooseDialogueThreadStore.cpp
          grep -q 'mode 0600' agent/src/LocalGooseDialogueThreadStore.cpp
          grep -q 'bind_local_goose_dialogue_thread_head' agent/src/LiveControl.cpp
          grep -q 'inspect_local_goose_dialogue_thread_head' agent/src/LiveControl.cpp
          grep -q 'submit_local_goose_dialogue_v3_preferred_next' agent/src/LiveControl.cpp
          grep -q 'expected_thread_revision' agent/src/LiveControl.cpp
          grep -q 'local-thread-v3-bind' agent/src/control_main.cpp
          grep -q 'local-thread-v3-head' agent/src/control_main.cpp
          grep -q 'local-thread-v3-send' agent/src/control_main.cpp
          grep -q 'preferred dialogue head conflict after durable Task submission' agent/src/LiveControlProcessor.cpp
          grep -q 'same_preferred_v3_request' agent/src/LiveControlProcessor.cpp
          ! grep -q 'LocalGooseDialogueThreadStore' agent/src/main.cpp

          grep -q 'local_goose_dialogue_thread_sidecar_schema = 2' \
            agent/src/LocalGooseDialogueThreadStore.hpp
          grep -q 'local_goose_dialogue_thread_history' \
            agent/src/LocalGooseDialogueThreadStore.cpp
          grep -q 'history_from' agent/src/LocalGooseDialogueThreadStore.cpp
          grep -q 'LocalGooseDialogueCompletionFeedStore' \
            agent/src/LocalGooseDialogueCompletionFeed.hpp
          grep -q 'local_goose_dialogue_completion_event' \
            agent/src/LocalGooseDialogueCompletionFeed.cpp
          grep -q 'UNIQUE(thread_alias,thread_revision)' \
            agent/src/LocalGooseDialogueCompletionFeed.cpp
          grep -q 'next_for_consumer' \
            agent/src/LocalGooseDialogueCompletionFeed.cpp
          grep -q 'acknowledge' \
            agent/src/LocalGooseDialogueCompletionFeed.cpp
          grep -q 'O_NOFOLLOW' agent/src/LocalGooseDialogueCompletionFeed.cpp
          grep -q 'mode 0600' agent/src/LocalGooseDialogueCompletionFeed.cpp
          grep -q 'history_from' agent/src/LocalGooseDialogueCompletionFeed.cpp
          ! grep -Eq 'OpenAI|CurlHttpTransport|SecretSource|ProviderTaskHandler|systemctl|podman|LocalGooseCycleStimulus' \
            agent/src/LocalGooseDialogueCompletionFeed.cpp agent/src/LocalGooseDialogueCompletionFeed.hpp
          ! grep -Eq '(^|[^[:alnum:]_])(system|popen)[[:space:]]*\(' \
            agent/src/LocalGooseDialogueCompletionFeed.cpp
          ! grep -q 'LocalGooseDialogueCompletionFeed' agent/src/main.cpp

          grep -q 'LocalGooseDialogueV3Handler' agent/src/LocalGooseDialogueV3Handler.hpp
          grep -q 'legacy-v2-human' agent/src/LocalGooseDialogueV3Handler.cpp
          grep -q 'direct local multi-actor conversation' agent/src/LocalGooseDialogueV3Handler.cpp
          grep -q 'max_history_turns = 6' agent/src/LocalGooseDialogueV3Handler.cpp
          grep -q 'max_history_bytes = 40 \* 1024' agent/src/LocalGooseDialogueV3Handler.cpp
          grep -q 'max_prompt_bytes = 48 \* 1024' agent/src/LocalGooseDialogueV3Handler.cpp
          grep -q 'max_lineage_depth = 4096' agent/src/LocalGooseDialogueV3Handler.cpp
          grep -q 'tools_enabled = false' agent/src/LocalGooseDialogueV3Handler.cpp
          grep -q 'control_socket.clear' agent/src/LocalGooseDialogueV3Handler.cpp
          grep -q 'governance_path.clear' agent/src/LocalGooseDialogueV3Handler.cpp
          ! grep -Eq 'OpenAI|CurlHttpTransport|SecretSource|ProviderTaskHandler|LiveControl|systemctl|podman' \
            agent/src/LocalGooseDialogueV3Handler.cpp agent/src/LocalGooseDialogueV3Handler.hpp
          ! grep -Eq '(^|[^[:alnum:]_])(system|popen)[[:space:]]*\(' \
            agent/src/LocalGooseDialogueV3Handler.cpp
          ! grep -q 'LocalGooseDialogueV3Handler' agent/src/main.cpp

          grep -q 'LocalGooseDialogueHandler' agent/src/local_goose_dialogue_proof_main.cpp
          grep -q 'provider_execution=false tools_enabled=false network_expected=none' \
            agent/src/local_goose_dialogue_proof_main.cpp

      - name: Prove deploy remains code-only
        run: |
          set -eu
          sh -n agent/scripts/prove-local-goose-dialogue-fedora.sh
          sh -n agent/scripts/deploy-local-goose-dialogue-production.sh
          grep -q 'AUTHORIZED_LOCAL_GOOSE_DIALOGUE_CODE_DEPLOY' \
            agent/scripts/deploy-local-goose-dialogue-production.sh
          grep -q '321df97f8b03e12de1727ad13c5e9d05646fb807e52fbef9093fc61127b98595' \
            agent/scripts/deploy-local-goose-dialogue-production.sh
          grep -q 'LOCAL_GOOSE_DIALOGUE_TASKS' \
            agent/scripts/deploy-local-goose-dialogue-production.sh
          grep -q 'FEDORA_LOCAL_GOOSE_DIALOGUE_CODE_DEPLOY=PASS' \
            agent/scripts/deploy-local-goose-dialogue-production.sh
          grep -q 'PROVIDER_TOTAL' agent/scripts/deploy-local-goose-dialogue-production.sh
          grep -q 'CYCLE_CURSOR' agent/scripts/deploy-local-goose-dialogue-production.sh
          grep -q 'STIMULI=' agent/scripts/deploy-local-goose-dialogue-production.sh
          ! grep -Eq 'gaudere-control[^\n]*local-message' \
            agent/scripts/deploy-local-goose-dialogue-production.sh

          sh -n agent/scripts/deploy-local-goose-dialogue-v2-production.sh
          grep -q 'AUTHORIZED_LOCAL_GOOSE_DIALOGUE_V2_CODE_DEPLOY' \
            agent/scripts/deploy-local-goose-dialogue-v2-production.sh
          grep -q 'c83667ebd552032dcc92c62516bbfe7b22d91ac87432d63a7ffd4c0ba287a897' \
            agent/scripts/deploy-local-goose-dialogue-v2-production.sh
          grep -q 'LOCAL_GOOSE_DIALOGUE_V1_TASKS' \
            agent/scripts/deploy-local-goose-dialogue-v2-production.sh
          grep -q 'LOCAL_GOOSE_DIALOGUE_V2_TASKS' \
            agent/scripts/deploy-local-goose-dialogue-v2-production.sh
          grep -q 'local-thread-start' \
            agent/scripts/deploy-local-goose-dialogue-v2-production.sh
          grep -q 'local-thread-next' \
            agent/scripts/deploy-local-goose-dialogue-v2-production.sh
          grep -q 'FEDORA_LOCAL_GOOSE_DIALOGUE_V2_CODE_DEPLOY=PASS' \
            agent/scripts/deploy-local-goose-dialogue-v2-production.sh
          grep -q 'PROVIDER_TOTAL' agent/scripts/deploy-local-goose-dialogue-v2-production.sh
          grep -q 'CYCLE_CURSOR' agent/scripts/deploy-local-goose-dialogue-v2-production.sh
          grep -q 'STIMULI=' agent/scripts/deploy-local-goose-dialogue-v2-production.sh
          ! grep -Eq 'gaudere-control[^\n]*local-thread-(start|next)' \
            agent/scripts/deploy-local-goose-dialogue-v2-production.sh

      - name: Prove first production dialogue is separately authorized
        run: |
          set -eu
          sh -n agent/scripts/first-production-local-goose-dialogue.sh
          grep -q 'AUTHORIZED_FIRST_PRODUCTION_DIALOGUE' \
            agent/scripts/first-production-local-goose-dialogue.sh
          grep -q 'first-production-dialogue-v1' \
            agent/scripts/first-production-local-goose-dialogue.sh
          grep -q "C'est Bertrand" \
            agent/scripts/first-production-local-goose-dialogue.sh
          grep -q 'provider.call:openai.responses' \
            agent/scripts/first-production-local-goose-dialogue.sh
          grep -q 'local_goose_cycle_cursor' \
            agent/scripts/first-production-local-goose-dialogue.sh
          grep -q 'local_goose_cycle_stimuli' \
            agent/scripts/first-production-local-goose-dialogue.sh
          grep -q 'LOCAL_GOOSE_DIALOGUE_TASKS' \
            agent/scripts/first-production-local-goose-dialogue.sh
          grep -q 'FIRST_PRODUCTION_LOCAL_GOOSE_DIALOGUE=PASS' \
            agent/scripts/first-production-local-goose-dialogue.sh

          sh -n agent/scripts/first-production-local-goose-dialogue-v2.sh
          grep -q 'AUTHORIZED_FIRST_PRODUCTION_DIALOGUE_V2' \
            agent/scripts/first-production-local-goose-dialogue-v2.sh
          grep -q 'first-production-dialogue-v2' \
            agent/scripts/first-production-local-goose-dialogue-v2.sh
          grep -q "C'est Bertrand" \
            agent/scripts/first-production-local-goose-dialogue-v2.sh
          grep -q '95660bd47c52de5bbac298047055f6b390018c6f86bee7457e59a88d18f0e3b6' \
            agent/scripts/first-production-local-goose-dialogue-v2.sh
          grep -q 'local-thread-start' \
            agent/scripts/first-production-local-goose-dialogue-v2.sh
          grep -q 'gaudere.cognition.local-goose-dialogue.v2' \
            agent/scripts/first-production-local-goose-dialogue-v2.sh
          grep -q 'gaudere.cognition.local-goose-dialogue-v2-response.v1' \
            agent/scripts/first-production-local-goose-dialogue-v2.sh
          grep -q 'provider.call:openai.responses' \
            agent/scripts/first-production-local-goose-dialogue-v2.sh
          grep -q 'LOCAL_GOOSE_DIALOGUE_V1_TASKS' \
            agent/scripts/first-production-local-goose-dialogue-v2.sh
          grep -q 'LOCAL_GOOSE_DIALOGUE_V2_TASKS' \
            agent/scripts/first-production-local-goose-dialogue-v2.sh
          grep -q 'FIRST_PRODUCTION_LOCAL_GOOSE_DIALOGUE_V2=PASS' \
            agent/scripts/first-production-local-goose-dialogue-v2.sh

          sh -n agent/scripts/first-production-local-goose-dialogue-v2-successor.sh
          grep -q 'AUTHORIZED_FIRST_PRODUCTION_DIALOGUE_V2_SUCCESSOR' \
            agent/scripts/first-production-local-goose-dialogue-v2-successor.sh
          grep -q 'cognition.local-goose-dialogue.v2:82164bd3699f19c5ff77046e6c60299d898ec225c5174b30c3d653aaa5510b19' \
            agent/scripts/first-production-local-goose-dialogue-v2-successor.sh
          grep -q 'c740110698daef49e4249223ac3a0b53342b97daf453fca994e4e8f8678e6cfd' \
            agent/scripts/first-production-local-goose-dialogue-v2-successor.sh
          grep -q 'first-production-dialogue-v2-turn-1' \
            agent/scripts/first-production-local-goose-dialogue-v2-successor.sh
          grep -q 'local-thread-next' \
            agent/scripts/first-production-local-goose-dialogue-v2-successor.sh
          ! grep -q 'local-thread-start' \
            agent/scripts/first-production-local-goose-dialogue-v2-successor.sh
          grep -q 'turn_index.*1' \
            agent/scripts/first-production-local-goose-dialogue-v2-successor.sh
          grep -q 'provider.call:openai.responses' \
            agent/scripts/first-production-local-goose-dialogue-v2-successor.sh
          grep -q 'LOCAL_GOOSE_DIALOGUE_V2_TASKS' \
            agent/scripts/first-production-local-goose-dialogue-v2-successor.sh
          grep -q 'FIRST_PRODUCTION_LOCAL_GOOSE_DIALOGUE_V2_SUCCESSOR=PASS' \
            agent/scripts/first-production-local-goose-dialogue-v2-successor.sh

      - name: Build and run dialogue tests
        run: |
          set -eu
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/prefix/lib/pkgconfig"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/prefix/lib"
          cd agent
          autoreconf --install --force
          mkdir build-dialogue
          cd build-dialogue
          ../configure CXXFLAGS="-O2 -Wall -Wextra -Wpedantic -Werror"
          make --jobs=2 -C src gaudere-agent gaudere-control gaudere-local-goose-dialogue-proof gaudere-local-goose-dialogue-v2-proof
          make --jobs=2 -C tests \
            local_goose_dialogue_test \
            local_goose_dialogue_v2_test \
            local_goose_dialogue_v3_test \
            local_goose_dialogue_v3_handler_test \
            local_goose_dialogue_thread_store_test \
            local_goose_dialogue_completion_feed_test \
            local_goose_dialogue_v2_handler_test \
            local_goose_dialogue_handler_test \
            live_control_test \
            live_control_processor_test
          test -x src/gaudere-agent
          test -x src/gaudere-control
          control_help_status=0
          control_help=$(src/gaudere-control --help 2>&1) || control_help_status=$?
          test "$control_help_status" = "2"
          printf '%s\n' "$control_help" | grep -q 'local-message'
          printf '%s\n' "$control_help" | grep -q 'local-thread-start'
          printf '%s\n' "$control_help" | grep -q 'local-thread-next'
          printf '%s\n' "$control_help" | grep -q 'local-thread-v3-start'
          printf '%s\n' "$control_help" | grep -q 'local-thread-v3-next'
          printf '%s\n' "$control_help" | grep -q 'local-thread-v3-bind'
          printf '%s\n' "$control_help" | grep -q 'local-thread-v3-head'
          printf '%s\n' "$control_help" | grep -q 'local-thread-v3-send'
          grep -q 'control_help_status=0' ../scripts/deploy-local-goose-dialogue-v2-production.sh
          grep -q 'control usage probe returned unexpected status' ../scripts/deploy-local-goose-dialogue-v2-production.sh
          test -x src/gaudere-local-goose-dialogue-proof
          test -x src/gaudere-local-goose-dialogue-v2-proof
          src/gaudere-local-goose-dialogue-proof --help 2>&1 | grep -q -- '--model-sha256'
          src/gaudere-local-goose-dialogue-v2-proof --help 2>&1 | grep -q -- '--model-sha256'
          sh -n ../scripts/prove-local-goose-dialogue-v2-fedora.sh
          grep -q -- '--network none' ../scripts/prove-local-goose-dialogue-v2-fedora.sh
          grep -q 'PRODUCTION_V2_DIALOGUE_TASKS' ../scripts/prove-local-goose-dialogue-v2-fedora.sh
          grep -q 'FEDORA_LOCAL_GOOSE_DIALOGUE_V2_ISOLATED=PASS' ../scripts/prove-local-goose-dialogue-v2-fedora.sh
          grep -q 'gaudere-local-goose-dialogue-v2-proof' ../Containerfile
          tests/local_goose_dialogue_test | grep -Fx 'local_goose_dialogue_test: PASS'
          tests/local_goose_dialogue_v2_test | grep -Fx 'local_goose_dialogue_v2_test: PASS'
          tests/local_goose_dialogue_v3_test | grep -Fx 'local_goose_dialogue_v3_test: PASS'
          tests/local_goose_dialogue_v3_handler_test | grep -Fx 'local_goose_dialogue_v3_handler_test: PASS'
          tests/local_goose_dialogue_thread_store_test | grep -Fx 'local_goose_dialogue_thread_store_test: PASS'
          tests/local_goose_dialogue_completion_feed_test | grep -Fx 'local_goose_dialogue_completion_feed_test: PASS'
          tests/local_goose_dialogue_thread_store_test | grep -Fx 'local_goose_dialogue_thread_store_test: PASS'
          tests/local_goose_dialogue_v2_handler_test | grep -Fx 'local_goose_dialogue_v2_handler_test: PASS'
          tests/local_goose_dialogue_handler_test | grep -Fx 'local_goose_dialogue_handler_test: PASS'
          tests/live_control_test
          tests/live_control_processor_test | grep -Fx 'All live control processor tests passed'
