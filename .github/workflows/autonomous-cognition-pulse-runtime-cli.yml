name: Autonomous cognition pulse runtime CLI proof

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fedora-44-autonomous-pulse-runtime:
    runs-on: ubuntu-latest
    container: fedora:44

    steps:
      - name: Install build dependencies
        run: >
          dnf install -y
          autoconf
          automake
          diffutils
          gcc-c++
          git
          json-devel
          libcurl-devel
          libtool
          make
          pkgconf-pkg-config
          sqlite
          sqlite-devel

      - uses: actions/checkout@v4
        with:
          path: agent
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: sol-ai-agent/gaudere
          path: gaudere
          fetch-depth: 0

      - name: Pin Gaudere dependency
        run: |
          set -eu
          gaudere_ref=$(tr -d '\r\n' < agent/gaudere.ref)
          case "$gaudere_ref" in
            *[!0-9a-f]*|'') exit 1 ;;
          esac
          test "${#gaudere_ref}" -eq 40
          git -C gaudere checkout --detach "$gaudere_ref"
          test "$(git -C gaudere rev-parse HEAD)" = "$gaudere_ref"

      - name: Build and install Gaudere
        run: |
          set -eu
          cd gaudere
          autoreconf --install --force
          mkdir build
          cd build
          ../configure --prefix="$GITHUB_WORKSPACE/prefix" \
            CXXFLAGS="-O2 -Wall -Wextra -Wpedantic -Werror"
          make --jobs=2 check
          make install

      - name: Prove authority remains provider-free and disabled
        run: |
          set -eu
          grep -q 'gaudere-autonomous-cognition-pulse' agent/src/Makefile.am
          grep -q -- '--seed-after-explicit-autonomous-pulse-go' \
            agent/src/autonomous_cognition_pulse_main.cpp
          grep -q -- '--observe-after-explicit-autonomous-pulse-go' \
            agent/src/autonomous_cognition_pulse_main.cpp
          grep -q 'StateLock state_lock' agent/src/autonomous_cognition_pulse_main.cpp
          grep -q 'SQLITE_OPEN_READONLY' agent/src/autonomous_cognition_pulse_main.cpp
          grep -q 'provider_effects=0' agent/src/autonomous_cognition_pulse_main.cpp
          ! grep -Eq 'OpenAI|ProviderTaskHandler|CurlHttpTransport|SecretSource|ActionStore' \
            agent/src/autonomous_cognition_pulse_main.cpp
          ! grep -q 'AutonomousCognitionPulse' agent/src/main.cpp
          ! grep -R -q 'gaudere-autonomous-cognition-pulse' agent/deploy/quadlet
          grep -q 'cp /opt/gaudere-agent/bin/gaudere-autonomous-cognition-pulse' \
            agent/Containerfile
          grep -q 'ENTRYPOINT \["/usr/local/bin/gaudere-agent"\]' agent/Containerfile

      - name: Configure and build Agent
        run: |
          set -eu
          cd agent
          autoreconf --install --force
          mkdir build
          cd build
          PKG_CONFIG_PATH="$GITHUB_WORKSPACE/prefix/lib/pkgconfig" \
            ../configure --prefix="$GITHUB_WORKSPACE/agent-prefix" \
            CXXFLAGS="-O2 -Wall -Wextra -Wpedantic -Werror"
          PKG_CONFIG_PATH="$GITHUB_WORKSPACE/prefix/lib/pkgconfig" \
          LD_LIBRARY_PATH="$GITHUB_WORKSPACE/prefix/lib" \
            make --jobs=2 check
          make install

      - name: Prove runtime binary linkage has no provider path
        run: |
          set -eu
          binary="$GITHUB_WORKSPACE/agent/build/src/gaudere-autonomous-cognition-pulse"
          test -x "$binary"
          file "$binary"
          ! ldd "$binary" | grep -q libcurl
          ! nm -C "$binary" | grep -Eq 'OpenAI|ProviderTaskHandler|CurlHttpTransport|FileSecretSource'
          "$binary" --help | grep -q -- '--observe-after-explicit-autonomous-pulse-go'

      - name: Re-run full provider-free pulse component proof
        run: |
          set -eu
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/prefix/lib/pkgconfig"
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            -Iagent/src $(pkg-config --cflags gaudere-persistence-sqlite gaudere) \
            agent/tests/autonomous_cognition_pulse_test.cpp \
            agent/src/AutonomousCognitionPulse.cpp \
            agent/src/AutonomousCognitionPulseStore.cpp \
            agent/src/CanonicalCognitionDecision.cpp \
            agent/src/Sha256.cpp \
            agent/src/CurrentCognitionCycle.cpp \
            agent/src/ResumeContextSnapshot.cpp \
            agent/src/ResumeContextSnapshotInspection.cpp \
            agent/src/TaskExecutor.cpp \
            $(pkg-config --libs gaudere-persistence-sqlite gaudere) -lsqlite3 \
            -o /tmp/autonomous-cognition-pulse-test
          LD_LIBRARY_PATH="$GITHUB_WORKSPACE/prefix/lib" \
            /tmp/autonomous-cognition-pulse-test

      - name: Prove check is read-only and invalid seed fails closed
        run: |
          set -eu
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/prefix/lib"
          agent_bin="$GITHUB_WORKSPACE/agent/build/src/gaudere-agent"
          pulse_bin="$GITHUB_WORKSPACE/agent/build/src/gaudere-autonomous-cognition-pulse"
          root=$(mktemp -d)
          state="$root/state.db"
          sidecar="$root/pulse.db"

          "$agent_bin" --state "$state" --check >/tmp/agent-check.out
          test -f "$state"
          test ! -e "$sidecar"
          "$pulse_bin" --state "$state" --sidecar "$sidecar" --check \
            >/tmp/pulse-check-before.out
          grep -q '^sidecar_exists=false$' /tmp/pulse-check-before.out
          grep -q '^provider_effects=0$' /tmp/pulse-check-before.out
          test ! -e "$sidecar"

          actions_before=$(sqlite3 "$state" 'SELECT COUNT(*) FROM actions;')
          budget_before=$(sqlite3 "$state" 'SELECT COUNT(*) FROM budget_consumptions;')
          wake_before=$(sqlite3 "$state" 'SELECT COUNT(*) FROM wake_intents;')
          tasks_before=$(sqlite3 "$state" 'SELECT COUNT(*) FROM tasks;')

          set +e
          "$pulse_bin" --state "$state" --sidecar "$sidecar" \
            --seed-after-explicit-autonomous-pulse-go missing-current-cognition \
            >/tmp/pulse-invalid-seed.out 2>&1
          rc=$?
          set -e
          test "$rc" -eq 3
          test -f "$sidecar"
          test "$(sqlite3 "$sidecar" 'PRAGMA user_version;')" = 1
          test "$(sqlite3 "$sidecar" 'SELECT COUNT(*) FROM autonomous_cognition_pulse_cursor;')" = 0
          test "$(sqlite3 "$state" 'SELECT COUNT(*) FROM actions;')" = "$actions_before"
          test "$(sqlite3 "$state" 'SELECT COUNT(*) FROM budget_consumptions;')" = "$budget_before"
          test "$(sqlite3 "$state" 'SELECT COUNT(*) FROM wake_intents;')" = "$wake_before"
          test "$(sqlite3 "$state" 'SELECT COUNT(*) FROM tasks;')" = "$tasks_before"

          "$pulse_bin" --state "$state" --sidecar "$sidecar" --check \
            >/tmp/pulse-check-after.out
          grep -q '^sidecar_schema=1$' /tmp/pulse-check-after.out
          grep -q '^pulse_seeded=false$' /tmp/pulse-check-after.out
          grep -q '^provider_effects=0$' /tmp/pulse-check-after.out

          set +e
          "$pulse_bin" --state "$state" --sidecar "$sidecar" \
            --observe-after-explicit-autonomous-pulse-go \
            >/tmp/pulse-unseeded-observe.out 2>&1
          rc=$?
          set -e
          test "$rc" -eq 2
          grep -q '^result=unseeded$' /tmp/pulse-unseeded-observe.out
          grep -q '^provider_effects=0$' /tmp/pulse-unseeded-observe.out
