name: Local Goose writable runtime / read-only model gate

on:
  pull_request:
    paths:
      - 'scripts/promote-local-goose-provider-off.sh'
      - 'scripts/promote-local-goose-provider-off-base.sh'
      - 'scripts/repair-local-goose-runtime-mount.sh'
      - '.github/workflows/local-goose-runtime-mount.yml'
  workflow_dispatch:

jobs:
  runtime-model-split:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: dnf -y install coreutils python3 grep
      - name: Prove executable delivery scripts
        run: |
          test -x scripts/promote-local-goose-provider-off.sh
          test -x scripts/repair-local-goose-runtime-mount.sh
          test ! -x scripts/promote-local-goose-provider-off-base.sh
      - name: Prove Podman 5.8 Memory=256M repair, writable runtime and read-only model cache
        run: |
          set -eu
          root=$(mktemp -d)
          mkdir -p "$root/goose/cache/huggingface" "$root/config/containers/systemd"
          cat > "$root/fake-systemctl" <<'SH'
          #!/bin/sh
          if [ "$1" = "--user" ] && [ "$2" = "is-active" ]; then
              printf 'inactive\n'
              exit 3
          fi
          if [ "$1" = "--user" ] && [ "$2" = "daemon-reload" ]; then
              exit 0
          fi
          exit 2
          SH
          chmod 700 "$root/fake-systemctl"
          sha=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          cat > "$root/config/containers/systemd/gaudere-agent.container" <<EOF
          [Container]
          Image=sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          Network=none
          ReadOnly=true
          NoNewPrivileges=true
          DropCapability=all
          Memory=256M
          Volume=/tmp/state:/var/lib/gaudere:Z
          Volume=$root/goose:/var/lib/gaudere/goose:ro,Z
          Exec=/usr/local/bin/gaudere-agent --state /var/lib/gaudere/state.db --control-socket /tmp/gaudere-control.sock --local-activity-sidecar /var/lib/gaudere/local-activity-pulse.db --local-goose-model /unsloth/gemma-4-E4B-it-GGUF:Q4_K_M --local-goose-model-sha256 $sha --local-goose-governance /var/lib/gaudere/goose-governance.db
          EOF
          XDG_CONFIG_HOME="$root/config" \
          GAUDERE_GOOSE_ROOT="$root/goose" \
          SYSTEMCTL="$root/fake-systemctl" \
          scripts/repair-local-goose-runtime-mount.sh
          quadlet="$root/config/containers/systemd/gaudere-agent.container"
          grep -Fx "Volume=$root/goose:/var/lib/gaudere/goose:rw,Z" "$quadlet"
          grep -Fx "Volume=$root/goose/cache/huggingface:/var/lib/gaudere/goose/cache/huggingface:ro" "$quadlet"
          grep -Fx 'Memory=12G' "$quadlet"
          ! grep -q '^MemorySwap=' "$quadlet"
          grep -Fx 'Network=none' "$quadlet"
          ! grep -q -- '--openai-model' "$quadlet"
          ! grep -q -- '--autonomous-pulse-provider' "$quadlet"
          ! grep -q -- '--wake-intents' "$quadlet"
          # Idempotence: a second repair changes nothing and still succeeds.
          before=$(sha256sum "$quadlet" | cut -d' ' -f1)
          XDG_CONFIG_HOME="$root/config" \
          GAUDERE_GOOSE_ROOT="$root/goose" \
          SYSTEMCTL="$root/fake-systemctl" \
          scripts/repair-local-goose-runtime-mount.sh
          after=$(sha256sum "$quadlet" | cut -d' ' -f1)
          test "$before" = "$after"
      - name: Prove missing Memory= receives the bounded bootstrap floor
        run: |
          set -eu
          root=$(mktemp -d)
          mkdir -p "$root/goose/cache/huggingface" "$root/config/containers/systemd"
          cat > "$root/fake-systemctl" <<'SH'
          #!/bin/sh
          if [ "$1" = "--user" ] && [ "$2" = "is-active" ]; then exit 3; fi
          if [ "$1" = "--user" ] && [ "$2" = "daemon-reload" ]; then exit 0; fi
          exit 2
          SH
          chmod 700 "$root/fake-systemctl"
          sha=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          cat > "$root/config/containers/systemd/gaudere-agent.container" <<EOF
          [Container]
          Image=sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          Network=none
          ReadOnly=true
          NoNewPrivileges=true
          DropCapability=all
          Volume=/tmp/state:/var/lib/gaudere:Z
          Volume=$root/goose:/var/lib/gaudere/goose:ro,Z
          Exec=/usr/local/bin/gaudere-agent --state /var/lib/gaudere/state.db --control-socket /tmp/gaudere-control.sock --local-activity-sidecar /var/lib/gaudere/local-activity-pulse.db --local-goose-model /unsloth/gemma-4-E4B-it-GGUF:Q4_K_M --local-goose-model-sha256 $sha --local-goose-governance /var/lib/gaudere/goose-governance.db
          EOF
          XDG_CONFIG_HOME="$root/config" \
          GAUDERE_GOOSE_ROOT="$root/goose" \
          SYSTEMCTL="$root/fake-systemctl" \
          scripts/repair-local-goose-runtime-mount.sh
          quadlet="$root/config/containers/systemd/gaudere-agent.container"
          test "$(grep -c '^Memory=' "$quadlet")" -eq 1
          grep -Fx 'Memory=12G' "$quadlet"
          ! grep -q '^MemorySwap=' "$quadlet"
      - name: Prove higher finite operator Memory= budget is preserved
        run: |
          set -eu
          root=$(mktemp -d)
          mkdir -p "$root/goose/cache/huggingface" "$root/config/containers/systemd"
          cat > "$root/fake-systemctl" <<'SH'
          #!/bin/sh
          if [ "$1" = "--user" ] && [ "$2" = "is-active" ]; then exit 3; fi
          if [ "$1" = "--user" ] && [ "$2" = "daemon-reload" ]; then exit 0; fi
          exit 2
          SH
          chmod 700 "$root/fake-systemctl"
          sha=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          cat > "$root/config/containers/systemd/gaudere-agent.container" <<EOF
          [Container]
          Image=sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          Network=none
          ReadOnly=true
          NoNewPrivileges=true
          DropCapability=all
          Memory=16G
          Volume=/tmp/state:/var/lib/gaudere:Z
          Volume=$root/goose:/var/lib/gaudere/goose:rw,Z
          Volume=$root/goose/cache/huggingface:/var/lib/gaudere/goose/cache/huggingface:ro
          Exec=/usr/local/bin/gaudere-agent --state /var/lib/gaudere/state.db --control-socket /tmp/gaudere-control.sock --local-activity-sidecar /var/lib/gaudere/local-activity-pulse.db --local-goose-model /unsloth/gemma-4-E4B-it-GGUF:Q4_K_M --local-goose-model-sha256 $sha --local-goose-governance /var/lib/gaudere/goose-governance.db
          EOF
          XDG_CONFIG_HOME="$root/config" \
          GAUDERE_GOOSE_ROOT="$root/goose" \
          SYSTEMCTL="$root/fake-systemctl" \
          scripts/repair-local-goose-runtime-mount.sh
          quadlet="$root/config/containers/systemd/gaudere-agent.container"
          grep -Fx 'Memory=16G' "$quadlet"
          ! grep -q '^MemorySwap=' "$quadlet"
      - name: Reject hidden PodmanArgs memory authority
        run: |
          set -eu
          root=$(mktemp -d)
          mkdir -p "$root/goose/cache/huggingface" "$root/config/containers/systemd"
          cat > "$root/fake-systemctl" <<'SH'
          #!/bin/sh
          if [ "$1" = "--user" ] && [ "$2" = "is-active" ]; then exit 3; fi
          if [ "$1" = "--user" ] && [ "$2" = "daemon-reload" ]; then exit 0; fi
          exit 2
          SH
          chmod 700 "$root/fake-systemctl"
          sha=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          cat > "$root/config/containers/systemd/gaudere-agent.container" <<EOF
          [Container]
          Image=sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          Network=none
          ReadOnly=true
          NoNewPrivileges=true
          DropCapability=all
          PodmanArgs=--memory=256M
          Volume=/tmp/state:/var/lib/gaudere:Z
          Volume=$root/goose:/var/lib/gaudere/goose:ro,Z
          Exec=/usr/local/bin/gaudere-agent --state /var/lib/gaudere/state.db --control-socket /tmp/gaudere-control.sock --local-activity-sidecar /var/lib/gaudere/local-activity-pulse.db --local-goose-model /unsloth/gemma-4-E4B-it-GGUF:Q4_K_M --local-goose-model-sha256 $sha --local-goose-governance /var/lib/gaudere/goose-governance.db
          EOF
          if XDG_CONFIG_HOME="$root/config" GAUDERE_GOOSE_ROOT="$root/goose" SYSTEMCTL="$root/fake-systemctl" scripts/repair-local-goose-runtime-mount.sh; then
              printf 'hidden PodmanArgs memory authority was unexpectedly accepted\n' >&2
              false
          fi
