name: Resume-after-wake fake provider proof

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fedora-44-provider-fake:
    runs-on: ubuntu-latest
    container: fedora:44

    steps:
      - name: Install build dependencies
        run: >
          dnf install -y
          autoconf
          automake
          gcc-c++
          git
          json-devel
          libcurl-devel
          libtool
          make
          pkgconf-pkg-config
          sqlite-devel

      - uses: actions/checkout@v4
        with:
          path: agent
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: sol-ai-agent/gaudere
          path: gaudere
          fetch-depth: 0

      - name: Pin Gaudere dependency
        run: |
          set -eu
          gaudere_ref=$(tr -d '\r\n' < agent/gaudere.ref)
          case "$gaudere_ref" in
            *[!0-9a-f]*|'') exit 1 ;;
          esac
          test "${#gaudere_ref}" -eq 40
          git -C gaudere checkout --detach "$gaudere_ref"
          test "$(git -C gaudere rev-parse HEAD)" = "$gaudere_ref"

      - name: Build and install Gaudere
        run: |
          set -eu
          cd gaudere
          autoreconf --install --force
          mkdir build
          cd build
          ../configure --prefix="$GITHUB_WORKSPACE/prefix" \
            CXXFLAGS="-O2 -Wall -Wextra -Wpedantic -Werror"
          make --jobs=2 check
          make install

      - name: Prove production wiring remains absent
        run: |
          set -eu
          ! grep -q 'ResumeAfterWakeCognition' agent/src/Makefile.am
          ! grep -Eq 'OpenAI|CurlHttpTransport|OpenAIResponsesProvider' \
            agent/tests/resume_after_wake_provider_fake_test.cpp
          ! grep -Eq 'OpenAI|CurlHttpTransport|OpenAIResponsesProvider' \
            agent/src/ResumeAfterWakeCognition.cpp

      - name: Build existing Agent tests
        run: |
          set -eu
          cd agent
          autoreconf --install --force
          mkdir build
          cd build
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/prefix/lib/pkgconfig"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/prefix/lib"
          ../configure CXXFLAGS="-O2 -Wall -Wextra -Wpedantic -Werror"
          make --jobs=2 check

      - name: Compile provider-fake proof out of production binary
        run: |
          set -eu
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/prefix/lib/pkgconfig"
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            -Iagent/src $(pkg-config --cflags gaudere) \
            agent/tests/resume_after_wake_provider_fake_test.cpp \
            agent/src/ExplicitWake.cpp \
            agent/src/WakeSourceDecision.cpp \
            agent/src/ResumeAfterWake.cpp \
            agent/src/ResumeAfterWakeCognition.cpp \
            agent/src/ProviderTaskHandler.cpp \
            agent/src/TaskExecutor.cpp \
            $(pkg-config --libs gaudere) -lsqlite3 \
            -o /tmp/resume-after-wake-provider-fake-test

      - name: Run provider-fake proof
        run: |
          set -eu
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/prefix/lib"
          /tmp/resume-after-wake-provider-fake-test
