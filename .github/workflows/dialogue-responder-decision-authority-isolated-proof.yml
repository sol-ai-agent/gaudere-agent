name: Dialogue responder decision authority isolated proof gate

on:
  pull_request:
    paths:
      - Containerfile
      - src/LocalGooseDialogueResponderAuthority.cpp
      - src/LocalGooseDialogueResponderAuthority.hpp
      - src/LocalGooseDialogueResponderAuthorityStore.cpp
      - src/LocalGooseDialogueResponderAuthorityStore.hpp
      - src/LocalGooseDialogueResponderAuthorityService.cpp
      - src/LocalGooseDialogueResponderAuthorityService.hpp
      - src/LocalGooseDialogueResponderDispatcher.cpp
      - src/LocalGooseDialogueResponderDispatcher.hpp
      - src/LocalGooseDialogueResponderStore.cpp
      - src/LocalGooseDialogueResponderStore.hpp
      - src/LocalGooseDialogueResponderObserver.cpp
      - src/LocalGooseDialogueResponderObserver.hpp
      - src/local_goose_dialogue_responder_decision_authority_proof_main.cpp
      - scripts/prove-local-goose-dialogue-responder-decision-authority-fedora.sh
      - .github/workflows/dialogue-responder-decision-authority-isolated-proof.yml
  push:
    branches: [main]
    paths:
      - Containerfile
      - src/LocalGooseDialogueResponderAuthority.cpp
      - src/LocalGooseDialogueResponderAuthority.hpp
      - src/LocalGooseDialogueResponderAuthorityStore.cpp
      - src/LocalGooseDialogueResponderAuthorityStore.hpp
      - src/LocalGooseDialogueResponderAuthorityService.cpp
      - src/LocalGooseDialogueResponderAuthorityService.hpp
      - src/LocalGooseDialogueResponderDispatcher.cpp
      - src/LocalGooseDialogueResponderDispatcher.hpp
      - src/LocalGooseDialogueResponderStore.cpp
      - src/LocalGooseDialogueResponderStore.hpp
      - src/LocalGooseDialogueResponderObserver.cpp
      - src/LocalGooseDialogueResponderObserver.hpp
      - src/local_goose_dialogue_responder_decision_authority_proof_main.cpp
      - scripts/prove-local-goose-dialogue-responder-decision-authority-fedora.sh
      - .github/workflows/dialogue-responder-decision-authority-isolated-proof.yml

permissions:
  contents: read

jobs:
  authority-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prove decision authority remains explicit and copy-only
        shell: bash
        run: |
          set -euxo pipefail
          proof=src/local_goose_dialogue_responder_decision_authority_proof_main.cpp
          script=scripts/prove-local-goose-dialogue-responder-decision-authority-fedora.sh

          sh -n "$script"

          grep -Fq 'allow_schema_upgrade' "$proof"
          grep -Fq 'authority_enabled = true' "$proof"
          grep -Fq 'PREPARED_GRANT_RESTART=no-activation' "$proof"
          grep -Fq 'PREPARED_DECISION_RESTART=no-bind' "$proof"
          grep -Fq 'INTENT_BOUND_RESTART=no-dispatch' "$proof"
          grep -Fq 'SYSTEM_DECISION=blocked' "$proof"
          grep -Fq 'FRESH_DECISION_PER_HUMAN=proved' "$proof"
          grep -Fq 'AUTO_RENEW=blocked' "$proof"
          grep -Fq 'FINAL_RESPONDER_CURSOR=7' "$proof"
          grep -Fq 'FINAL_PENDING_SEQUENCE=8' "$proof"
          grep -Fq 'GAUDERE_DIALOGUE_RESPONDER_DECISION_AUTHORITY_PROOF=PASS' "$proof"

          grep -Fq 'sqlite3.connect(f"file:{source}?mode=ro", uri=True)' "$script"
          grep -Fq 'src.backup(dst)' "$script"
          grep -Fq 'production_before' "$script"
          grep -Fq 'production_after' "$script"
          grep -Fq "PRAGMA user_version;')\" = \"2\"" "$script"
          grep -Fq 'production signature changed during isolated proof' "$script"
          grep -Fq 'production authority tables appeared' "$script"
          grep -Fq 'production sequence 4 received a responder disposition' "$script"
          grep -Fq 'FEDORA_GAUDERE_DIALOGUE_RESPONDER_DECISION_AUTHORITY_ISOLATED=PASS' "$script"
          grep -Fq "info --format '{{.Host.Security.Rootless}}'" "$script"
          grep -Fq -- '--user 0:0' "$script"
          grep -Fq '"$podman_command" run --rm --network none' "$script"
          grep -Fq -- '--read-only --read-only-tmpfs' "$script"
          grep -Fq -- '--security-opt no-new-privileges --cap-drop all' "$script"

          # Live Fedora state is read-only and copied with SQLite backup. The
          # proof container sees only the copied scenario DBs.
          ! grep -Eq 'systemctl[^\n]*(start|stop|restart|enable|disable)' "$script"
          ! grep -Eq '\$podman_command"[[:space:]]+(exec|stop|start|restart)' "$script"
          ! grep -Eq -- '-v "\$(state_directory|state_database|cycle_sidecar|stimulus_sidecar|thread_sidecar|completion_sidecar|responder_sidecar)' "$script"
          ! grep -Eq 'curl[[:space:]]|wget[[:space:]]|ssh[[:space:]]|scp[[:space:]]' "$script"
          ! grep -Eq 'dialogue-feed-ack|dialogue-responder-(lease-create|prepare|dispatch)|local-thread-v3-send|stimulate-local-goose-cycle|control[[:space:]]+openai' "$script"
          ! grep -Fq -- '--userns keep-id' "$script"
          ! grep -Eq 'for command .*g\+\+|for command .*pkg-config' "$script"
          ! grep -Eq '^[[:space:]]*dnf[[:space:]]' "$script"

          # No production binary, daemon, CLI authority surface or image wiring.
          ! grep -Fq 'local_goose_dialogue_responder_decision_authority_proof_main.cpp' src/Makefile.am
          ! grep -Fq 'local_goose_dialogue_responder_decision_authority_proof_main.cpp' Containerfile
          ! grep -Fq 'decision-authority-proof' src/main.cpp
          ! grep -Fq 'LocalGooseDialogueResponderAuthorityService' src/main.cpp
          ! grep -Fq 'LocalGooseDialogueResponderAuthorityService' src/control_main.cpp
          ! grep -Fq 'LocalGooseDialogueResponderAuthorityService' src/LiveControl.cpp
          ! grep -Fq 'LocalGooseDialogueResponderAuthorityService' src/LiveControlProcessor.cpp

  fedora-44-build-and-test:
    needs: authority-guard
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 30
    steps:
      - name: Install build dependencies inside CI container
        run: >
          dnf install -y
          autoconf
          automake
          curl-devel
          gcc-c++
          git
          json-devel
          libtool
          make
          pkgconf-pkg-config
          sqlite-devel

      - uses: actions/checkout@v4
        with:
          path: agent
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: sol-ai-agent/gaudere
          path: gaudere
          fetch-depth: 0

      - name: Build pinned Gaudere core
        run: |
          set -eu
          gaudere_ref=$(tr -d '\r\n' < agent/gaudere.ref)
          git -C gaudere checkout --detach "$gaudere_ref"
          cd gaudere
          autoreconf --install --force
          mkdir build
          cd build
          ../configure --prefix="$GITHUB_WORKSPACE/prefix" \
            CXXFLAGS="-O2 -Wall -Wextra -Wpedantic -Werror"
          make --jobs=2 check
          make install

      - name: Build and run Agent tests with decision authority contract
        run: |
          set -eu
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/prefix/lib/pkgconfig"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/prefix/lib"
          cd agent
          autoreconf --install --force
          mkdir build
          cd build
          ../configure CXXFLAGS="-O2 -Wall -Wextra -Wpedantic -Werror"
          make --jobs=2 check

      - name: Compile isolated decision authority proof helper with Werror
        run: |
          set -eu
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/prefix/lib/pkgconfig"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/prefix/lib"
          cflags=$(pkg-config --cflags gaudere-persistence-sqlite nlohmann_json)
          libs=$(pkg-config --libs gaudere-persistence-sqlite nlohmann_json)
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            $cflags -Iagent/src \
            agent/src/local_goose_dialogue_responder_decision_authority_proof_main.cpp \
            agent/src/LocalGooseDialogueResponderAuthorityService.cpp \
            agent/src/LocalGooseDialogueResponderAuthorityStore.cpp \
            agent/src/LocalGooseDialogueResponderAuthority.cpp \
            agent/src/LocalGooseDialogueResponderObserver.cpp \
            agent/src/LocalGooseDialogueResponderDispatcher.cpp \
            agent/src/LocalGooseDialoguePreferredSubmitter.cpp \
            agent/src/LocalGooseDialogueResponderStore.cpp \
            agent/src/LocalGooseDialogueResponder.cpp \
            agent/src/LocalGooseDialogueCompletionFeed.cpp \
            agent/src/LocalGooseDialogueThreadStore.cpp \
            agent/src/LocalGooseDialogueV2.cpp \
            agent/src/LocalGooseDialogueV3.cpp \
            agent/src/Sha256.cpp \
            -o decision-authority-proof \
            $libs -lsqlite3
          ./decision-authority-proof --help | grep -Fq \
            -- '--state PATH --thread-sidecar PATH'
