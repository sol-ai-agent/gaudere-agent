name: WorkerDev branch cleanup 2026-09-05

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/workerdev-branch-cleanup-20260905.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify and delete exact stale branch refs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: sol-ai-agent
          DEFAULT_BRANCH: main
        shell: bash
        run: |
          set -Eeuo pipefail
          declare -A expected=(
            ["sol/autonomous-pulse-stale-refresh"]="87d2b778f9b857517495cbc82645dbd0454e038d"
            ["sol/continuity-delta-checkpoint-148"]="8d281256abe4be3261f6b5f41c1c6af79bd99651"
            ["sol/continuity-delta-checkpoint-one-shot"]="13ab0d90b44848518f158156b77862dcd180e609"
            ["sol/promote-provider-capable-off-v0"]="038229e7e8a3b5783461b6a651bab3eb2a441a1d"
            ["sol/pulse-stale-refresh-145"]="d22a3b46020db0cde8c2ee7805149e5cd3b3058f"
            ["sol/pulse-stale-refresh-wiring-145"]="62c4a11fda336e9543666d9a9155b4ed39656991"
          )
          declare -A proof=(
            ["sol/autonomous-pulse-stale-refresh"]="absorbed"
            ["sol/continuity-delta-checkpoint-148"]="merged"
            ["sol/continuity-delta-checkpoint-one-shot"]="merged"
            ["sol/promote-provider-capable-off-v0"]="merged"
            ["sol/pulse-stale-refresh-145"]="merged"
            ["sol/pulse-stale-refresh-wiring-145"]="merged"
          )
          mapfile -t branches < <(printf '%s\n' "${!expected[@]}" | sort)
          deleted=()

          restore_deleted() {
            local branch
            set +e
            for branch in "${deleted[@]}"; do
              gh api -X POST "repos/$REPO/git/refs" \
                -f "ref=refs/heads/$branch" \
                -f "sha=${expected[$branch]}" >/dev/null
            done
          }
          on_exit() {
            local rc=$?
            if (( rc != 0 )); then
              restore_deleted
            fi
            exit "$rc"
          }
          trap on_exit EXIT

          for branch in "${branches[@]}"; do
            [[ "$branch" != "$DEFAULT_BRANCH" ]]
            current="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq .object.sha)"
            [[ "$current" == "${expected[$branch]}" ]]
            open_count="$(gh api -X GET "repos/$REPO/pulls" \
              -f state=open -f "head=$OWNER:$branch" -f per_page=100 --jq length)"
            [[ "$open_count" == 0 ]]

            if [[ "${proof[$branch]}" == merged ]]; then
              merged_count="$(gh api -X GET "repos/$REPO/pulls" \
                -f state=closed -f "head=$OWNER:$branch" -f per_page=100 |
                jq --arg sha "${expected[$branch]}" \
                  '[.[] | select(.head.sha == $sha and .merged_at != null)] | length')"
              [[ "$merged_count" -ge 1 ]]
            elif [[ "${proof[$branch]}" == absorbed ]]; then
              comparison="$(gh api "repos/$REPO/compare/$DEFAULT_BRANCH...${expected[$branch]}")"
              [[ "$(jq -r .ahead_by <<<"$comparison")" == 0 ]]
            else
              exit 91
            fi
          done

          for branch in "${branches[@]}"; do
            current="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq .object.sha)"
            [[ "$current" == "${expected[$branch]}" ]]
            gh api -X DELETE "repos/$REPO/git/refs/heads/$branch"
            deleted+=("$branch")
            printf 'DELETED %s %s %s\n' "$branch" "${expected[$branch]}" "${proof[$branch]}"
          done

          for branch in "${branches[@]}"; do
            if gh api "repos/$REPO/git/ref/heads/$branch" >/dev/null 2>&1; then
              exit 92
            fi
          done
          trap - EXIT
