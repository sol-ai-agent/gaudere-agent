name: Local activity pulse sidecar gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fedora-44-local-activity-sidecar:
    runs-on: ubuntu-latest
    container: fedora:44

    steps:
      - name: Install build dependencies
        run: dnf install -y gcc-c++ git sqlite-devel

      - uses: actions/checkout@v4
        with:
          path: agent
          fetch-depth: 0

      - name: Prove sidecar has no external-effect authority or runtime wiring
        run: |
          set -eu
          files='agent/src/LocalActivityPulseStore.cpp agent/src/LocalActivityPulseStore.hpp agent/src/LocalActivityPulseSidecarInspection.cpp'
          grep -q 'continuity.local-observation-pulse.v1' agent/src/LocalActivityPulseStore.hpp
          grep -q 'SQLITE_OPEN_READONLY' agent/src/LocalActivityPulseSidecarInspection.cpp
          grep -q 'replacement.revision != expected.revision + 1' agent/src/LocalActivityPulseStore.cpp
          grep -q '0600' agent/src/LocalActivityPulseStore.cpp
          ! grep -Eq '#include .*Provider|#include .*OpenAI|#include .*Curl|#include .*HttpTransport|#include .*SecretSource|#include .*WakeIntent|#include .*ActionStore|#include .*TaskStore' $files
          ! grep -Eq 'consume\(' $files
          ! grep -Eq '(^|[^[:alnum:]_])(system|fork|popen|socket|connect)[[:space:]]*\(' $files
          ! grep -Eq '(^|[^[:alnum:]_])exec(v|ve|vp|vpe|l|le|lp|lpe)?[[:space:]]*\(' $files
          ! grep -q 'LocalActivityPulseStore' agent/src/main.cpp
          ! grep -R -q 'local-observation-pulse' agent/deploy/quadlet

      - name: Compile sidecar proof
        run: |
          set -eu
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            -Iagent/src \
            agent/tests/local_activity_pulse_store_test.cpp \
            agent/src/LocalActivityPulseStore.cpp \
            agent/src/LocalActivityPulseSidecarInspection.cpp \
            -lsqlite3 \
            -o /tmp/local-activity-pulse-store-test

      - name: Run sidecar proof
        run: /tmp/local-activity-pulse-store-test
