name: WorkerDev branch cleanup 2026-09-17

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/workerdev-branch-cleanup-20260917.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete exact verified branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          pairs=$(cat <<'PAIRS'
          sol/checkpoint-readonly-inspection-154	6f86a4ada72f0a99871521aefd15d6ccaf66c4d3
          sol/design-local-activity-pulse-152	6e056fdbb251783dc8c588486960ded994a6d93a
          sol/design-local-goose-loop-174	7a09cdab6bfa0d71d9e6119342630a7c55aa1a4d
          sol/fix-goose-memory-budget-169	284d2c7e405176484c74093680d7756624bab589
          sol/fix-goose-model-persistence-167	b2d13c4ba19b032fb3c14fb0a42dc0585923a2c0
          sol/fix-goose-runtime-writable-168	ea232ca79c803bf0e4ffbd6091fa9180f99a625e
          sol/fix-local-goose-cycle-generation-invariant-177	b135c1632ecd50bf5378a965f6bc7367ef3b7435
          sol/fix-local-goose-decision-normalization-171	8d70c5c1accb0b4046aa7f411a95a4247d5d4e8e
          sol/fix-local-goose-fenced-json-172	6ae91ddb25f95b72818379f2b0d2863e1f10f6bc
          sol/fix-local-goose-structured-output-173	e0b2433ea1cc18d604133a8ad2bd2961d16d1172
          sol/fix-podman58-memory-quadlet-170	a1942fc5982475b79a6d932948dcacbcd0967b62
          sol/local-activity-production-162	c312ce5da9f3e0245ee1619da154ceef116ab457
          sol/local-activity-pulse-machine-154	95c1c4762f0a74bc830a5fb3541ec460aee06985
          sol/local-activity-runtime-packaging-162	317828255572e8bb2e7ad5f89edb4b2a7af6ba77
          sol/local-activity-scheduler-154	79c93d6c42ae137a4a36265facf8846032a70c69
          sol/local-activity-status-154	95386c71b11cde644c7845ade015d104fb7dac9b
          sol/local-goose-cognition-165	d5d3ea7fc531839172bc7bb65b2f744523c976e5
          sol/local-goose-cycle-contract-175	10d061828e13581b148311669d0b257d8eea65db
          sol/local-goose-cycle-scheduler-service-178	e28ffcedfb6047684fe31cb4a4c2f1b4d28b52f2
          sol/local-goose-cycle-sidecar-176	9566ad007bafc55779345fc51de9c13847afc081
          sol/local-goose-cycle-store-176	e77a725d3c5663a4a3cb46040e28fbe9c14d81e4
          sol/local-observation-bounded-evidence-154	2928b7687609e64b769da6e9d7d429c2a3b2fe1a
          sol/local-observation-pulse-154	0fc446f9944065dfaade6b8158401892c8cde24b
          sol/local-observation-sidecar-154	305c3e57d5434ff9bfe4236cfd1f5dff928c2c6b
          PAIRS
          )
          while IFS=$'\t' read -r branch expected; do
            test -n "$branch"
            test "$branch" != "main"
            current=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha')
            test "$current" = "$expected"
            open_count=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" -f state=open -f head="${owner}:${branch}" --jq 'length')
            test "$open_count" = "0"
          done <<< "$pairs"
          while IFS=$'\t' read -r branch expected; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          done <<< "$pairs"