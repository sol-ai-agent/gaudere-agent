name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fedora:
    runs-on: ubuntu-latest
    container: fedora:latest

    steps:
      - name: Install build dependencies
        run: >
          dnf install -y
          autoconf
          automake
          gcc-c++
          git
          gzip
          json-devel
          libcurl-devel
          libtool
          make
          pkgconf-pkg-config
          python3
          sqlite-devel
          tar
          util-linux

      - uses: actions/checkout@v4
        with:
          path: agent

      - uses: actions/checkout@v4
        with:
          repository: sol-ai-agent/gaudere
          path: gaudere
          fetch-depth: 0

      - name: Pin Gaudere dependency
        run: |
          set -eu
          gaudere_ref=$(tr -d '\r\n' < agent/gaudere.ref)
          case "$gaudere_ref" in
            *[!0-9a-f]*|'')
              echo "invalid agent/gaudere.ref" >&2
              exit 1
              ;;
          esac
          test "${#gaudere_ref}" -eq 40
          git -C gaudere checkout --detach "$gaudere_ref"
          test "$(git -C gaudere rev-parse HEAD)" = "$gaudere_ref"
          echo "Using Gaudere ref: $gaudere_ref"

      - name: Validate deployment scripts
        run: |
          sh -n agent/scripts/build-image.sh
          sh -n agent/scripts/install-user-service.sh
          sh -n agent/scripts/install-openai-secret.sh
          sh -n agent/scripts/backup-state.sh
          sh -n agent/scripts/control-service.sh
          sh -n agent/scripts/validate-host-runtime.sh
          sh -n agent/scripts/validate-state-backup.sh
          sh -n agent/scripts/validate-provider-secret.sh
          sh -n agent/scripts/validate-provider-budget.sh
          sh -n agent/scripts/validate-openai-network.sh
          sh -n agent/scripts/validate-openai-authorized.sh
          sh -n agent/scripts/validate-live-control.sh
          sh -n agent/scripts/validate-schema-migration-copy.sh
          sh -n agent/scripts/validate-schema-v4-migration-copy.sh
          sh -n agent/scripts/deploy-schema-v3.sh
          sh -n agent/tests/schema_v4_migration_copy_validator_test.sh

      - name: Build and install Gaudere
        run: |
          cd gaudere
          autoreconf --install --force
          mkdir build
          cd build
          ../configure --prefix="$GITHUB_WORKSPACE/prefix" \
            CXXFLAGS="-O2 -Wall -Wextra -Wpedantic -Werror"
          make --jobs=2 check
          make install

      - name: Build and test Gaudere Agent
        run: |
          cd agent
          autoreconf --install --force
          mkdir build
          cd build
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/prefix/lib/pkgconfig"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/prefix/lib"
          ../configure CXXFLAGS="-O2 -Wall -Wextra -Wpedantic -Werror"
          make --jobs=2 check

      - name: Validate copied schema migration
        run: |
          set -eu
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/prefix/lib"
          agent_bin="$GITHUB_WORKSPACE/agent/build/src/gaudere-agent"
          workspace=$(mktemp -d)
          source_state="$workspace/source"
          data_home="$workspace/data"
          mkdir -p "$source_state" "$data_home"
          trap 'rm -rf "$workspace"' EXIT

          python3 - "$source_state/state.db" <<'PY'
          import sqlite3
          import sys

          with sqlite3.connect(sys.argv[1]) as db:
              db.executescript("""
              PRAGMA user_version=2;
              CREATE TABLE tasks (
                id TEXT PRIMARY KEY NOT NULL,
                idempotency_key TEXT NOT NULL UNIQUE,
                kind TEXT NOT NULL,
                input_content_type TEXT NOT NULL,
                input TEXT NOT NULL,
                max_input_bytes INTEGER NOT NULL,
                max_output_bytes INTEGER NOT NULL,
                max_runtime_ms INTEGER NOT NULL,
                max_attempts INTEGER NOT NULL,
                attempts_started INTEGER NOT NULL,
                status INTEGER NOT NULL,
                lease_owner TEXT,
                lease_expires_at_ms INTEGER,
                cancel_reason TEXT NOT NULL,
                result_content_type TEXT,
                result_output TEXT,
                result_failure_code TEXT,
                result_failure_message TEXT
              );
              INSERT INTO tasks VALUES (
                'ci-migration-copy','local.echo:ci-migration-copy','local.echo',
                'text/plain','durable v2 input',4096,4096,1000,1,1,3,
                NULL,NULL,'','text/plain','durable v2 result','',''
              );
              CREATE TABLE actions (
                id TEXT PRIMARY KEY NOT NULL,
                idempotency_key TEXT NOT NULL UNIQUE,
                critical INTEGER NOT NULL,
                status INTEGER NOT NULL,
                effect_result INTEGER NOT NULL,
                lease_owner TEXT,
                lease_expires_at_ms INTEGER
              );
              CREATE TABLE budget_consumptions (
                scope TEXT NOT NULL,
                idempotency_key TEXT NOT NULL,
                consumed_at_ms INTEGER NOT NULL,
                PRIMARY KEY(scope,idempotency_key)
              );
              """)
          PY

          archive="$workspace/gaudere-state-v2.tar.gz"
          tar -czf "$archive" -C "$source_state" .
          (cd "$workspace" && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")

          GAUDERE_AGENT_BIN="$agent_bin" XDG_DATA_HOME="$data_home" \
            sh "$GITHUB_WORKSPACE/agent/scripts/validate-schema-migration-copy.sh" \
            "$archive" ci-migration-copy > "$workspace/migration.out"
          cat "$workspace/migration.out"
          grep -q '^schema_before=2$' "$workspace/migration.out"
          grep -q '^schema_after=3$' "$workspace/migration.out"
          grep -q '^status=succeeded$' "$workspace/migration.out"
          grep -q '^result_output="durable v2 result"$' "$workspace/migration.out"
          grep -q '^gaudere schema migration copy validation: PASS$' "$workspace/migration.out"

      - name: Validate schema v4 migration and rollback proof
        run: |
          set -eu
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/prefix/lib"
          GAUDERE_AGENT_BIN="$GITHUB_WORKSPACE/agent/build/src/gaudere-agent" \
            sh "$GITHUB_WORKSPACE/agent/tests/schema_v4_migration_copy_validator_test.sh"

      - name: Validate staged production schema deployment
        run: |
          set -eu
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/prefix/lib"
          agent_bin="$GITHUB_WORKSPACE/agent/build/src/gaudere-agent"
          workspace=$(mktemp -d)
          data_home="$workspace/data"
          state="$data_home/gaudere/state"
          backups="$data_home/gaudere/backups"
          mkdir -p "$state" "$backups"
          trap 'rm -rf "$workspace"' EXIT

          python3 - "$state/state.db" <<'PY'
          import sqlite3
          import sys

          with sqlite3.connect(sys.argv[1]) as db:
              db.executescript("""
              PRAGMA user_version=2;
              CREATE TABLE tasks (
                id TEXT PRIMARY KEY NOT NULL,
                idempotency_key TEXT NOT NULL UNIQUE,
                kind TEXT NOT NULL,
                input_content_type TEXT NOT NULL,
                input TEXT NOT NULL,
                max_input_bytes INTEGER NOT NULL,
                max_output_bytes INTEGER NOT NULL,
                max_runtime_ms INTEGER NOT NULL,
                max_attempts INTEGER NOT NULL,
                attempts_started INTEGER NOT NULL,
                status INTEGER NOT NULL,
                lease_owner TEXT,
                lease_expires_at_ms INTEGER,
                cancel_reason TEXT NOT NULL,
                result_content_type TEXT,
                result_output TEXT,
                result_failure_code TEXT,
                result_failure_message TEXT
              );
              INSERT INTO tasks VALUES (
                'ci-staged','local.echo:ci-staged','local.echo',
                'text/plain','durable staged input',4096,4096,1000,1,1,3,
                NULL,NULL,'','text/plain','durable staged result','',''
              );
              CREATE TABLE actions (
                id TEXT PRIMARY KEY NOT NULL,
                idempotency_key TEXT NOT NULL UNIQUE,
                critical INTEGER NOT NULL,
                status INTEGER NOT NULL,
                effect_result INTEGER NOT NULL,
                lease_owner TEXT,
                lease_expires_at_ms INTEGER
              );
              CREATE TABLE budget_consumptions (
                scope TEXT NOT NULL,
                idempotency_key TEXT NOT NULL,
                consumed_at_ms INTEGER NOT NULL,
                PRIMARY KEY(scope,idempotency_key)
              );
              """)
          PY

          wrapper="$workspace/agent-wrapper.sh"
          cat > "$wrapper" <<'SH'
          #!/bin/sh
          if [ "$1" = "--state" ] && [ "$2" = "$GAUDERE_TEST_LIVE_DB" ]; then
              for argument in "$@"; do
                  if [ "$argument" = "--task" ]; then
                      exit 91
                  fi
              done
          fi
          exec "$GAUDERE_TEST_REAL_AGENT" "$@"
          SH
          chmod +x "$wrapper"

          # Inject a failure only after the staged v3 directory has been installed.
          # The deployment script must automatically put the original v2 state back.
          if GAUDERE_AGENT_BIN="$wrapper" \
              GAUDERE_TEST_REAL_AGENT="$agent_bin" \
              GAUDERE_TEST_LIVE_DB="$state/state.db" \
              GAUDERE_STATE_DIR="$state" GAUDERE_BACKUP_DIR="$backups" \
              GAUDERE_SKIP_SERVICE_CHECK=1 \
              sh "$GITHUB_WORKSPACE/agent/scripts/deploy-schema-v3.sh" ci-staged \
              > "$workspace/injected-failure.out" 2>&1; then
              echo "staged deployment unexpectedly survived injected post-swap failure" >&2
              exit 1
          fi

          python3 - "$state/state.db" <<'PY'
          import sqlite3, sys
          with sqlite3.connect(sys.argv[1]) as db:
              assert db.execute("PRAGMA user_version").fetchone()[0] == 2
          PY
          test -z "$(find "$data_home/gaudere" -maxdepth 1 -type d -name 'state.pre-v3-*' -print -quit)"
          failed=$(find "$data_home/gaudere" -maxdepth 1 -type d -name 'state.failed-v3-*' -print -quit)
          test -n "$failed"
          python3 - "$failed/state.db" <<'PY'
          import sqlite3, sys
          with sqlite3.connect(sys.argv[1]) as db:
              assert db.execute("PRAGMA user_version").fetchone()[0] == 3
          PY
          rm -rf "$failed"

          GAUDERE_AGENT_BIN="$agent_bin" \
              GAUDERE_STATE_DIR="$state" GAUDERE_BACKUP_DIR="$backups" \
              GAUDERE_SKIP_SERVICE_CHECK=1 \
              sh "$GITHUB_WORKSPACE/agent/scripts/deploy-schema-v3.sh" ci-staged \
              > "$workspace/deployment.out"
          cat "$workspace/deployment.out"
          grep -q '^schema_before=2$' "$workspace/deployment.out"
          grep -q '^staged_schema_before=2$' "$workspace/deployment.out"
          grep -q '^staged_schema_after=3$' "$workspace/deployment.out"
          grep -q '^budget_consumptions=0$' "$workspace/deployment.out"
          grep -q '^schema_after=3$' "$workspace/deployment.out"
          grep -q '^status=succeeded$' "$workspace/deployment.out"
          grep -q '^result_output="durable staged result"$' "$workspace/deployment.out"
          grep -q '^gaudere staged production schema deployment: READY$' "$workspace/deployment.out"

          python3 - "$state/state.db" <<'PY'
          import sqlite3, sys
          with sqlite3.connect(sys.argv[1]) as db:
              assert db.execute("PRAGMA user_version").fetchone()[0] == 3
          PY
          test -z "$(find "$state" -maxdepth 1 -name 'logical.*' -print -quit)"
          rollback=$(sed -n 's/^rollback_directory=//p' "$workspace/deployment.out" | tail -n 1)
          test -d "$rollback"
          python3 - "$rollback/state.db" <<'PY'
          import sqlite3, sys
          with sqlite3.connect(sys.argv[1]) as db:
              assert db.execute("PRAGMA user_version").fetchone()[0] == 2
          PY
          archive=$(sed -n 's/^backup=//p' "$workspace/deployment.out" | tail -n 1)
          test -f "$archive"
          test -f "$archive.sha256"
          (cd "$backups" && sha256sum -c "$(basename "$archive.sha256")")

      - name: Validate stopped-state backup and restore
        run: |
          set -eu
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/prefix/lib"
          agent_bin="$GITHUB_WORKSPACE/agent/build/src/gaudere-agent"
          state=$(mktemp -d)
          backups=$(mktemp -d)
          restored=$(mktemp -d)
          marker=$(mktemp)
          rm -f "$marker"
          trap 'rm -rf "$state" "$backups" "$restored" "$marker"' EXIT

          "$agent_bin" --state "$state/state.db" \
            --echo ci-backup "durable ci state" >/dev/null

          (
            exec 9>>"$state/state.db.lock"
            flock 9
            touch "$marker"
            sleep 2
          ) &
          locker=$!
          while [ ! -f "$marker" ]; do sleep 0.05; done
          if GAUDERE_STATE_DIR="$state" GAUDERE_BACKUP_DIR="$backups" \
              sh "$GITHUB_WORKSPACE/agent/scripts/backup-state.sh" \
              >"$backups/blocked.out" 2>"$backups/blocked.err"; then
            echo "backup unexpectedly succeeded while state lock was held" >&2
            exit 1
          fi
          grep -q 'state database is currently owned' "$backups/blocked.err"
          wait "$locker"

          archive=$(GAUDERE_STATE_DIR="$state" GAUDERE_BACKUP_DIR="$backups" \
            sh "$GITHUB_WORKSPACE/agent/scripts/backup-state.sh")
          test -f "$archive"
          test -f "$archive.sha256"
          (cd "$backups" && sha256sum -c "$(basename "$archive.sha256")")
          tar -xzf "$archive" -C "$restored"
          test -f "$restored/state.db"
          test ! -e "$restored/state.db.lock"

          "$agent_bin" --state "$restored/state.db" --task ci-backup \
            >"$restored/report"
          grep -q '^status=succeeded$' "$restored/report"
          grep -q '^result_output="durable ci state"$' "$restored/report"
          "$agent_bin" --state "$restored/state.db" \
            --echo ci-after-restore "restored writable" >/dev/null
