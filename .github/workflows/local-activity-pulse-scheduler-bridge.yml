name: Local activity pulse scheduler bridge proof

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fedora-44-local-activity-scheduler-bridge:
    runs-on: ubuntu-latest
    container: fedora:44

    steps:
      - name: Install build dependencies
        run: >
          dnf install -y
          autoconf
          automake
          gcc-c++
          git
          libtool
          make
          pkgconf-pkg-config
          sqlite-devel

      - uses: actions/checkout@v4
        with:
          path: agent
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: sol-ai-agent/gaudere
          path: gaudere
          fetch-depth: 0

      - name: Pin and build Gaudere
        run: |
          set -eu
          gaudere_ref=$(tr -d '\r\n' < agent/gaudere.ref)
          test "${#gaudere_ref}" -eq 40
          test -z "$(printf '%s' "$gaudere_ref" | tr -d '0-9a-f')"
          git -C gaudere checkout --detach "$gaudere_ref"
          cd gaudere
          autoreconf --install --force
          mkdir build
          cd build
          ../configure --prefix="$GITHUB_WORKSPACE/prefix" \
            CXXFLAGS="-O2 -Wall -Wextra -Wpedantic -Werror"
          make --jobs=2 check
          make install

      - name: Prove bridge owns no thread or external authority
        run: |
          set -eu
          files='agent/src/LocalActivityPulseSchedulerBridge.cpp agent/src/LocalActivityPulseSchedulerBridge.hpp'
          grep -q 'Scheduler& scheduler' agent/src/LocalActivityPulseSchedulerBridge.hpp
          grep -q 'request_at' agent/src/LocalActivityPulseSchedulerBridge.cpp
          ! grep -Eq 'WakeIntentStore|Provider|OpenAI|Curl|HttpTransport|SecretSource|TaskStore|ActionStore|budget::Store' $files
          ! grep -Eq 'std::thread|pthread|jthread|async[[:space:]]*\(' $files
          ! grep -Eq '(^|[^[:alnum:]_])(system|fork|popen|socket|connect)[[:space:]]*\(' $files
          ! grep -Eq '(^|[^[:alnum:]_])exec(v|ve|vp|vpe|l|le|lp|lpe)?[[:space:]]*\(' $files
          ! grep -q 'LocalActivityPulseSchedulerBridge' agent/src/main.cpp
          ! grep -R -q 'LocalActivityPulseSchedulerBridge' agent/deploy/quadlet

      - name: Compile scheduler bridge proof
        run: |
          set -eu
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/prefix/lib/pkgconfig"
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            -Iagent/src $(pkg-config --cflags gaudere) \
            agent/tests/local_activity_pulse_scheduler_bridge_test.cpp \
            agent/src/LocalActivityPulseSchedulerBridge.cpp \
            agent/src/LocalActivityPulseStore.cpp \
            $(pkg-config --libs gaudere) -lsqlite3 \
            -o /tmp/local-activity-pulse-scheduler-bridge-test

      - name: Run scheduler bridge proof
        run: |
          set -eu
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/prefix/lib"
          /tmp/local-activity-pulse-scheduler-bridge-test
