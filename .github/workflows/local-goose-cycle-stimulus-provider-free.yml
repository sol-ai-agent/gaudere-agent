name: Local Goose dormant stimulus provider-free gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fedora-44-local-goose-stimulus:
    runs-on: ubuntu-latest
    container: fedora:44

    steps:
      - name: Install build dependencies
        run: >
          dnf install -y
          autoconf
          automake
          gcc-c++
          git
          json-devel
          libcurl-devel
          libtool
          make
          pkgconf-pkg-config
          sqlite-devel

      - uses: actions/checkout@v4
        with:
          path: agent
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: sol-ai-agent/gaudere
          path: gaudere
          fetch-depth: 0

      - name: Build pinned Gaudere core
        run: |
          set -eu
          gaudere_ref=$(tr -d '\r\n' < agent/gaudere.ref)
          git -C gaudere checkout --detach "$gaudere_ref"
          cd gaudere
          autoreconf --install --force
          mkdir build
          cd build
          ../configure --prefix="$GITHUB_WORKSPACE/prefix" CXXFLAGS="-O2 -Wall -Wextra -Wpedantic -Werror"
          make --jobs=2 check
          make install

      - name: Prove dormant stimulus authority boundary
        run: |
          set -eu
          grep -q 'cognition.local-goose-cycle.stimulus.v1' agent/src/LocalGooseCycleStimulusStore.hpp
          grep -q 'explicit_local_recheck' agent/src/LocalGooseCycleStimulusStore.hpp
          grep -q 'SQLITE_OPEN_READONLY' agent/src/LocalGooseCycleStimulusStore.cpp
          grep -q 'target cursor revision already has an accepted stimulus' agent/src/LocalGooseCycleStimulusStore.cpp
          ! grep -Eq 'OpenAIResponsesProvider|CurlHttpTransport|SecretSource|ProviderTaskHandler'             agent/src/LocalGooseCycleStimulusStore.cpp             agent/src/LocalGooseCycleStimulusStore.hpp
          ! grep -Eq '(^|[^[:alnum:]_])(system|popen)[[:space:]]*\('             agent/src/LocalGooseCycleStimulusStore.cpp
          ! grep -Eq 'podman|systemctl|AF_INET|SOCK_STREAM'             agent/src/LocalGooseCycleStimulusStore.cpp             agent/src/LocalGooseCycleStimulusStore.hpp
          ! grep -q 'LocalGooseCycleStimulusStore' agent/src/main.cpp
          ! grep -q 'local-goose-cycle-stimulus' agent/deploy/quadlet/gaudere-agent.container
          ! grep -q 'local-goose-cycle-stimulus' agent/deploy/quadlet/gaudere-agent-openai.container.in

      - name: Prove re-arm live-control remains provider-free and production-unwired
        run: |
          set -eu
          grep -q 'accept_explicit_recheck' agent/src/LocalGooseCycleStimulusService.cpp
          grep -q 'canonical_local_goose_cycle_success' agent/src/LocalGooseCycleStimulusService.cpp
          grep -q 'scheduled.state = CycleState::scheduled' agent/src/LocalGooseCycleStimulusService.cpp
          grep -q 'stimulate_local_goose_cycle' agent/src/LiveControl.cpp
          grep -q 'stimulate-local-goose-cycle' agent/src/control_main.cpp
          grep -q -- '--stimulus-sidecar PATH' agent/src/local_goose_cycle_runtime_main.cpp
          grep -q 'LocalGooseCycleStimulusControl' agent/src/local_goose_cycle_runtime_main.cpp
          grep -q 'local_goose_cycle_may_have_changed' agent/src/local_goose_cycle_runtime_main.cpp
          ! grep -Eq 'OpenAIResponsesProvider|CurlHttpTransport|SecretSource|ProviderTaskHandler|LocalGooseRunner' \
            agent/src/LocalGooseCycleStimulusService.cpp \
            agent/src/LocalGooseCycleStimulusService.hpp \
            agent/src/LocalGooseCycleStimulusControl.cpp \
            agent/src/LocalGooseCycleStimulusControl.hpp
          ! grep -Eq '(^|[^[:alnum:]_])(system|popen)[[:space:]]*\(' \
            agent/src/LocalGooseCycleStimulusService.cpp \
            agent/src/LocalGooseCycleStimulusControl.cpp
          ! grep -Eq 'podman|systemctl|AF_INET|SOCK_STREAM' \
            agent/src/LocalGooseCycleStimulusService.cpp \
            agent/src/LocalGooseCycleStimulusService.hpp \
            agent/src/LocalGooseCycleStimulusControl.cpp \
            agent/src/LocalGooseCycleStimulusControl.hpp
          ! grep -q 'LocalGooseCycleStimulusService' agent/src/main.cpp
          ! grep -q 'local-goose-cycle-stimulus' agent/deploy/quadlet/gaudere-agent.container
          ! grep -q 'local-goose-cycle-stimulus' agent/deploy/quadlet/gaudere-agent-openai.container.in

      - name: Build and run stimulus tests with warnings as errors
        run: |
          set -eu
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/prefix/lib/pkgconfig"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/prefix/lib"
          cd agent
          autoreconf --install --force
          mkdir build-stimulus
          cd build-stimulus
          ../configure CXXFLAGS="-O2 -Wall -Wextra -Wpedantic -Werror"
          make --jobs=2 -C tests \
            local_goose_cycle_stimulus_store_test \
            local_goose_cycle_stimulus_service_test \
            live_control_test \
            live_control_processor_test
          make --jobs=2 -C src \
            gaudere-control \
            gaudere-local-goose-cycle-runtime \
            gaudere-local-goose-cycle-stimulus-proof
          src/gaudere-local-goose-cycle-stimulus-proof --help 2>&1 \
            | grep -q -- '--stimulus-sidecar PATH'
          tests/local_goose_cycle_stimulus_store_test | grep -Fx 'local_goose_cycle_stimulus_store_test: PASS'
          tests/local_goose_cycle_stimulus_service_test | grep -Fx 'local_goose_cycle_stimulus_service_test: PASS'
          tests/live_control_test | grep -Fx 'All live control tests passed'
          tests/live_control_processor_test | grep -Fx 'All live control processor tests passed'

      - name: Prove isolated Fedora helper boundary
        run: |
          set -eu
          sh -n agent/scripts/prove-local-goose-stimulus-fedora.sh
          grep -q -- '--target builder' agent/scripts/prove-local-goose-stimulus-fedora.sh
          grep -q -- '--network none' agent/scripts/prove-local-goose-stimulus-fedora.sh
          grep -q -- '--user "$host_uid:$host_gid"' agent/scripts/prove-local-goose-stimulus-fedora.sh
          grep -q 'stimulate-local-goose-cycle' agent/scripts/prove-local-goose-stimulus-fedora.sh
          grep -q 'production_cursor_after.*production_cursor_before' agent/scripts/prove-local-goose-stimulus-fedora.sh
          grep -q 'provider_after.*provider_before' agent/scripts/prove-local-goose-stimulus-fedora.sh
          grep -q 'FEDORA_LOCAL_GOOSE_STIMULUS_ISOLATED=PASS' agent/scripts/prove-local-goose-stimulus-fedora.sh
          ! grep -q 'gaudere-local-goose-cycle-stimulus-proof /opt/runtime/bin' agent/Containerfile
          ! grep -q '/usr/local/bin/gaudere-local-goose-cycle-stimulus-proof' agent/Containerfile
