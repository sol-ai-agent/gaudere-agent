name: Dialogue responder authority first decision prepare

on:
  pull_request:
    paths:
      - 'src/local_goose_dialogue_responder_authority_first_decision_main.cpp'
      - 'Containerfile.responder-authority-first-decision'
      - '.github/workflows/dialogue-responder-authority-first-decision-prepare.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority-first-decision-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prove first decision surface is prepare-only
        shell: bash
        run: |
          set -euo pipefail
          helper=src/local_goose_dialogue_responder_authority_first_decision_main.cpp
          containerfile=Containerfile.responder-authority-first-decision

          grep -Fq 'first-production-responder-authority-decision-seq4-v1' "$helper"
          grep -Fq 'cognition.local-goose-dialogue.responder-grant.v1:54f5770768e55b5bb0ddf0289c2a42555e0b8fbef6675726c4bc23b853cb2b5a' "$helper"
          grep -Fq 'authority-lease-v1-e1a58d3a65a1771c8b04b5e41d6eaeb571a7070975c73d69b2117725f00fbf63' "$helper"
          grep -Fq 'expected_sequence = 4' "$helper"
          grep -Fq '7297b1ad75c62c19a46780ab8cce874353d7fe95b260c504c844878a9d8db844' "$helper"
          grep -Fq '4fa4966a87986dd6d1a163c1a35d577f78cd0f2f08409acca431a6a97fc29935' "$helper"
          grep -Fq 'decision_message_kind = "intervention"' "$helper"
          grep -Fq 'Sol reprend le dialogue depuis le point de continuite valide.' "$helper"
          grep -Fq 'decision_intent_ttl_ms = 30LL * 60 * 1000' "$helper"
          grep -Fq '<inspect|prepare-decision>' "$helper"
          grep -Fq 'authority.prepare_decision(request)' "$helper"
          grep -Fq 'GAUDERE_DIALOGUE_RESPONDER_AUTHORITY_FIRST_DECISION_PREPARE=PASS' "$helper"
          grep -Fq 'BOUND_INTENT_ID=none' "$helper"
          grep -Fq 'SEQUENCE4_ACK=no' "$helper"

          ! grep -Fq 'bind_decision(' "$helper"
          ! grep -Fq '.dispatch(' "$helper"
          ! grep -Fq 'acknowledge_disposition' "$helper"
          ! grep -Fq 'commit_submission' "$helper"
          ! grep -Fq 'complete_disposition' "$helper"
          ! grep -Fq 'prepare_grant(' "$helper"
          ! grep -Fq 'activate_grant(' "$helper"

          grep -Fq 'io.gaudere.role="dialogue-responder-authority-first-decision-v1"' "$containerfile"
          grep -Fq '<inspect|prepare-decision>' "$containerfile"

  fedora-44-helper-build:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install build dependencies
        run: >-
          dnf install -y autoconf automake diffutils gcc-c++ git json-devel
          libcurl-devel libtool make pkgconf-pkg-config sqlite-devel

      - uses: actions/checkout@v4

      - name: Build pinned core
        shell: bash
        run: |
          set -euo pipefail
          core_ref=$(tr -d '\r\n' < gaudere.ref)
          git clone https://github.com/sol-ai-agent/gaudere.git /tmp/gaudere
          git -C /tmp/gaudere checkout --detach "$core_ref"
          cd /tmp/gaudere
          autoreconf --install --force
          mkdir build
          cd build
          ../configure --prefix=/tmp/gaudere-install CXXFLAGS='-O2 -Wall -Wextra -Wpedantic -Werror'
          make --jobs=2 check
          make install

      - name: Compile confined first-decision helper
        shell: bash
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH=/tmp/gaudere-install/lib/pkgconfig
          export LD_LIBRARY_PATH=/tmp/gaudere-install/lib
          cflags="$(pkg-config --cflags gaudere-persistence-sqlite nlohmann_json)"
          libs="$(pkg-config --libs gaudere-persistence-sqlite nlohmann_json)"
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            ${cflags} -Isrc \
            src/local_goose_dialogue_responder_authority_first_decision_main.cpp \
            src/LocalGooseDialogueResponderAuthorityService.cpp \
            src/LocalGooseDialogueResponderAuthorityStore.cpp \
            src/LocalGooseDialogueResponderAuthority.cpp \
            src/LocalGooseDialogueResponderDispatcher.cpp \
            src/LocalGooseDialoguePreferredSubmitter.cpp \
            src/LocalGooseDialogueResponderStore.cpp \
            src/LocalGooseDialogueResponder.cpp \
            src/LocalGooseDialogueCompletionFeed.cpp \
            src/LocalGooseDialogueThreadStore.cpp \
            src/LocalGooseDialogueV2.cpp \
            src/LocalGooseDialogueV3.cpp \
            src/Sha256.cpp \
            -o /tmp/authority-first-decision \
            ${libs} -lsqlite3
          help_output=$(/tmp/authority-first-decision --help)
          printf '%s\n' "$help_output"
          printf '%s\n' "$help_output" | grep -Fq '<inspect|prepare-decision>'
          ! printf '%s\n' "$help_output" | grep -Eq 'bind|dispatch|ack|activate-grant|prepare-grant'
