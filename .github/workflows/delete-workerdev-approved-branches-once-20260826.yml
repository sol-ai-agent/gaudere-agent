name: One-shot WorkerDev approved branch cleanup 2026-08-26

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/delete-workerdev-approved-branches-once-20260826.yml

permissions:
  contents: write
  pull-requests: read
  issues: read

jobs:
  delete-approved-branches:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Revalidate and atomically delete the exact approved refs
        shell: bash
        run: |
          set -euo pipefail

          records=(
            'sol/current-cognition-cycle-v0|263bcb17878c8aa8252309cfbfcf3c43c9f62296|110'
            'sol/current-cognition-provider-fake|754cd49ece292a063ad52f8b2d58321d86a188cd|115'
            'sol/first-real-wake-gate-v0|ec140dfef7fd9f6071259d9c4eca758379cf7e7a|80'
            'sol/resume-after-wake-design-v0|7a6efb2906be18dbb10c1ae44f2859d4089b5ca5|87'
            'sol/resume-after-wake-provider-fake-v0|306ac7c3462a718407e07f418a2ddf9ac44e505d|90'
            'sol/resume-after-wake-provider-free-v0|e5dfd09c57215877f00ac1aadbeefa9b76ca8413|88'
            'sol/resume-after-wake-runtime-gate-v0|08e4ee1391ed48b88693708dbfa686b90d56361d|92'
            'sol/resume-after-wake-v1-binding|89841c05c3a52b5b9ba067c52a1327d3a12e660b|99'
            'sol/resume-after-wake-v1-prepare|db2e86e2557ff2e8fe407c618d9784192cdc929f|105'
            'sol/resume-after-wake-v1-provider-fake|c8f3c102b81b4e567ca5143f378ff47dfd9bddd8|101'
            'sol/resume-after-wake-v1-real-gate|318a0ffd6cf20b9ee08f492624083fa5a2be4b2b|106'
            'sol/resume-context-snapshot-v1|734b4cc324210e1d0fa2acf1287d10641c128d78|97'
            'sol/resume-fresh-context-design-v1|50d20119dc4f4010d06661127f5ceea1e6955d01|95'
            'sol/resume-image-presence-gate-v0|fe8511c82e5f279b1b8aa1f358335991e976be2e|93'
            'sol/structured-cognition-output-v1|ec2efe0f67d09567427481f406efbfae3b241224|113'
            'sol/v1-real-output-contract|8581cbcd454b872a6ccb409e1d1de07204b9b0ed|108'
            'sol/wake-host-downtime-proof-v0|780945daa522f855445b7041c5dffc951467c139|82'
            'sol/wake-runtime-downtime-proof-v0|d1469c2280eb2d9a7f836853a28e0c1956911817|83'
          )

          keeps=(
            'sol/current-cognition-fake-provider-v0|5402d67c87c8a6595d5df18da7392cb17fd43ea1|ambiguous-no-pr'
            'sol/current-cognition-real-gate|19db6e4d934813014d3fba49827a3bfd22555da6|open-pr-117'
            'sol/resume-after-wake-v1-real|6cb27fcbf249ba1c93e55ceb7f4059debc189641|ambiguous-no-pr'
          )

          expected_branches=(
            main
            sol/current-cognition-cycle-v0
            sol/current-cognition-fake-provider-v0
            sol/current-cognition-provider-fake
            sol/current-cognition-real-gate
            sol/first-real-wake-gate-v0
            sol/resume-after-wake-design-v0
            sol/resume-after-wake-provider-fake-v0
            sol/resume-after-wake-provider-free-v0
            sol/resume-after-wake-runtime-gate-v0
            sol/resume-after-wake-v1-binding
            sol/resume-after-wake-v1-prepare
            sol/resume-after-wake-v1-provider-fake
            sol/resume-after-wake-v1-real
            sol/resume-after-wake-v1-real-gate
            sol/resume-context-snapshot-v1
            sol/resume-fresh-context-design-v1
            sol/resume-image-presence-gate-v0
            sol/structured-cognition-output-v1
            sol/v1-real-output-contract
            sol/wake-host-downtime-proof-v0
            sol/wake-runtime-downtime-proof-v0
          )

          main_actual="$(git ls-remote --exit-code --heads origin refs/heads/main | awk '{print $1}')"
          if [[ "$main_actual" != "$GITHUB_SHA" ]]; then
            echo "::error::REFUSE: main moved after this workflow started expected=$GITHUB_SHA actual=$main_actual"
            exit 1
          fi

          expected_branch_lines="$(printf '%s\n' "${expected_branches[@]}" | sort)"
          actual_branch_lines="$(git ls-remote --heads origin | awk '{sub("refs/heads/","",$2); print $2}' | sort)"
          if [[ "$actual_branch_lines" != "$expected_branch_lines" ]]; then
            echo "::error::REFUSE: remote branch set changed"
            diff -u <(printf '%s\n' "$expected_branch_lines") <(printf '%s\n' "$actual_branch_lines") || true
            exit 1
          fi

          open_pr_json="$(gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f per_page=100)"
          if ! jq -e --arg branch 'sol/current-cognition-real-gate'                --arg sha '19db6e4d934813014d3fba49827a3bfd22555da6'                'length == 1 and .[0].number == 117 and .[0].head.ref == $branch and .[0].head.sha == $sha'                <<<"$open_pr_json" >/dev/null; then
            echo "::error::REFUSE: open PR set or PR #117 head changed"
            jq '[.[] | {number, head_ref: .head.ref, head_sha: .head.sha}]' <<<"$open_pr_json"
            exit 1
          fi

          open_issue_json="$(gh api -X GET "repos/$GITHUB_REPOSITORY/issues" -f state=open -f per_page=100)"
          if ! jq -e '([.[] | select(.pull_request == null) | .number] | sort) == [111,116]'                <<<"$open_issue_json" >/dev/null; then
            echo "::error::REFUSE: open issue set changed"
            jq '[.[] | select(.pull_request == null) | .number] | sort' <<<"$open_issue_json"
            exit 1
          fi

          for keep in "${keeps[@]}"; do
            IFS='|' read -r branch expected reason <<<"$keep"
            actual="$(git ls-remote --exit-code --heads origin "refs/heads/$branch" | awk '{print $1}')"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::REFUSE: protected branch moved or disappeared: $branch expected=$expected actual=$actual"
              exit 1
            fi
            echo "protected=$branch sha=$expected reason=$reason"
          done

          refspecs=()
          for record in "${records[@]}"; do
            IFS='|' read -r branch expected pr_number <<<"$record"

            actual="$(git ls-remote --exit-code --heads origin "refs/heads/$branch" | awk '{print $1}')"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::REFUSE: branch moved or disappeared: $branch expected=$expected actual=$actual"
              exit 1
            fi

            open_for_head="$(gh api -X GET "repos/$GITHUB_REPOSITORY/pulls"               -f state=open -f head="sol-ai-agent:$branch" -f per_page=100 --jq 'length')"
            if [[ "$open_for_head" != 0 ]]; then
              echo "::error::REFUSE: open PR now uses $branch"
              exit 1
            fi

            pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number")"
            pr_state="$(jq -r '.state' <<<"$pr_json")"
            pr_merged="$(jq -r '.merged_at // ""' <<<"$pr_json")"
            pr_head_ref="$(jq -r '.head.ref' <<<"$pr_json")"
            pr_head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
            if [[ "$pr_state" != closed || -z "$pr_merged" || "$pr_head_ref" != "$branch" || "$pr_head_sha" != "$expected" ]]; then
              echo "::error::REFUSE: PR proof mismatch branch=$branch pr=$pr_number state=$pr_state merged_at=$pr_merged head_ref=$pr_head_ref head_sha=$pr_head_sha"
              exit 1
            fi

            echo "proof=merged_pr branch=$branch sha=$expected pr=$pr_number"
            refspecs+=(":refs/heads/$branch")
          done

          git push --atomic origin "${refspecs[@]}"

          for record in "${records[@]}"; do
            IFS='|' read -r branch _ _ <<<"$record"
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "::error::branch still exists after atomic cleanup: $branch"
              exit 1
            fi
            echo "deleted=$branch"
          done

          for keep in "${keeps[@]}"; do
            IFS='|' read -r branch expected _ <<<"$keep"
            actual="$(git ls-remote --exit-code --heads origin "refs/heads/$branch" | awk '{print $1}')"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::protected branch changed during cleanup: $branch expected=$expected actual=$actual"
              exit 1
            fi
          done

          main_after="$(git ls-remote --exit-code --heads origin refs/heads/main | awk '{print $1}')"
          if [[ "$main_after" != "$GITHUB_SHA" ]]; then
            echo "::error::main changed during cleanup expected=$GITHUB_SHA actual=$main_after"
            exit 1
          fi

          echo "deleted_count=${#records[@]}"
          echo "remaining_count=4"
          echo "protected=main"
