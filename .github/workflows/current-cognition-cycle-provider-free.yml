name: Current cognition cycle provider-free proof

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fedora-44-current-cognition:
    runs-on: ubuntu-latest
    container: fedora:44

    steps:
      - name: Install build dependencies
        run: >
          dnf install -y
          autoconf
          automake
          gcc-c++
          git
          json-devel
          libtool
          make
          pkgconf-pkg-config
          sqlite-devel

      - uses: actions/checkout@v4
        with:
          path: agent
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: sol-ai-agent/gaudere
          path: gaudere
          fetch-depth: 0

      - name: Pin Gaudere dependency
        run: |
          set -eu
          gaudere_ref=$(tr -d '\r\n' < agent/gaudere.ref)
          case "$gaudere_ref" in
            *[!0-9a-f]*|'') exit 1 ;;
          esac
          test "${#gaudere_ref}" -eq 40
          git -C gaudere checkout --detach "$gaudere_ref"
          test "$(git -C gaudere rev-parse HEAD)" = "$gaudere_ref"

      - name: Build and install Gaudere
        run: |
          set -eu
          cd gaudere
          autoreconf --install --force
          mkdir build
          cd build
          ../configure --prefix="$GITHUB_WORKSPACE/prefix" \
            CXXFLAGS="-O2 -Wall -Wextra -Wpedantic -Werror"
          make --jobs=2 check
          make install

      - name: Prove provider-free and production-unwired slice
        run: |
          set -eu
          ! grep -q 'CurrentCognitionCycle' agent/src/Makefile.am
          ! grep -Eq 'OpenAI|ProviderTaskHandler|CurlHttpTransport|SecretSource' \
            agent/src/CurrentCognitionCycle.cpp
          ! grep -Eq 'OpenAI|ProviderTaskHandler|CurlHttpTransport|SecretSource' \
            agent/tests/current_cognition_cycle_test.cpp
          grep -q 'cognition.current.v0' agent/src/CurrentCognitionCycle.hpp
          grep -q 'Return exactly one JSON object' agent/src/CurrentCognitionCycle.cpp
          grep -q 'Provider total is 6/12' agent/tests/current_cognition_cycle_test.cpp

      - name: Compile provider-free current cognition proof
        run: |
          set -eu
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/prefix/lib/pkgconfig"
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            -Iagent/src $(pkg-config --cflags gaudere-persistence-sqlite gaudere) \
            agent/tests/current_cognition_cycle_test.cpp \
            agent/src/CurrentCognitionCycle.cpp \
            agent/src/ResumeContextSnapshot.cpp \
            agent/src/ResumeContextSnapshotInspection.cpp \
            agent/src/TaskExecutor.cpp \
            $(pkg-config --libs gaudere-persistence-sqlite gaudere) -lsqlite3 \
            -o /tmp/current-cognition-cycle-test

      - name: Run repeatable provider-free cognition proof
        run: |
          set -eu
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/prefix/lib"
          /tmp/current-cognition-cycle-test
