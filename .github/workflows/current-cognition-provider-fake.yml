name: Current cognition fake provider proof

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fedora-44-current-cognition-provider-fake:
    runs-on: ubuntu-latest
    container: fedora:44

    steps:
      - name: Install build dependencies
        run: >
          dnf install -y
          autoconf
          automake
          gcc-c++
          git
          json-devel
          libtool
          make
          pkgconf-pkg-config
          sqlite-devel

      - uses: actions/checkout@v4
        with:
          path: agent
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: sol-ai-agent/gaudere
          path: gaudere
          fetch-depth: 0

      - name: Pin Gaudere dependency
        run: |
          set -eu
          gaudere_ref=$(tr -d '\r\n' < agent/gaudere.ref)
          case "$gaudere_ref" in
            *[!0-9a-f]*|'') exit 1 ;;
          esac
          test "${#gaudere_ref}" -eq 40
          git -C gaudere checkout --detach "$gaudere_ref"
          test "$(git -C gaudere rev-parse HEAD)" = "$gaudere_ref"

      - name: Build and install Gaudere
        run: |
          set -eu
          cd gaudere
          autoreconf --install --force
          mkdir build
          cd build
          ../configure --prefix="$GITHUB_WORKSPACE/prefix" \
            CXXFLAGS="-O2 -Wall -Wextra -Wpedantic -Werror"
          make --jobs=2 check
          make install

      - name: Prove fake-provider slice is production-unwired
        run: |
          set -eu
          ! grep -q 'CurrentCognitionHandler' agent/src/main.cpp
          ! grep -R -q 'CurrentCognitionHandler' agent/deploy/quadlet
          ! grep -Eq 'OpenAI|CurlHttpTransport|SecretSource' \
            agent/src/CurrentCognitionHandler.cpp
          ! grep -Eq 'OpenAI|CurlHttpTransport|SecretSource' \
            agent/tests/current_cognition_provider_fake_test.cpp
          grep -q 'valid_current_cognition_task' agent/src/CurrentCognitionHandler.cpp
          grep -q 'ResumeAfterWakeCognitionHandler' agent/src/CurrentCognitionHandler.hpp
          grep -q 'provider_response_not_durable' \
            agent/tests/current_cognition_provider_fake_test.cpp
          grep -q 'last_request->input == exact_input' \
            agent/tests/current_cognition_provider_fake_test.cpp

      - name: Compile current cognition fake-provider proof
        run: |
          set -eu
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/prefix/lib/pkgconfig"
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            -Iagent/src $(pkg-config --cflags gaudere-persistence-sqlite gaudere) \
            agent/tests/current_cognition_provider_fake_test.cpp \
            agent/src/CurrentCognitionHandler.cpp \
            agent/src/CurrentCognitionCycle.cpp \
            agent/src/ResumeAfterWakeCognition.cpp \
            agent/src/ResumeContextSnapshot.cpp \
            agent/src/ResumeContextSnapshotInspection.cpp \
            agent/src/ProviderTaskHandler.cpp \
            agent/src/TaskExecutor.cpp \
            $(pkg-config --libs gaudere-persistence-sqlite gaudere) -lsqlite3 \
            -o /tmp/current-cognition-provider-fake-test

      - name: Run current cognition fake-provider proof
        run: |
          set -eu
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/prefix/lib"
          /tmp/current-cognition-provider-fake-test
