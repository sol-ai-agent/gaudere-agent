name: Fedora 45 gaudere-chat read-only recovery

on:
  pull_request:
    paths:
      - 'src/GaudereChat.hpp'
      - 'src/GaudereChat.cpp'
      - 'src/chat_main.cpp'
      - 'tests/gaudere_chat_test.cpp'
      - '.github/workflows/gaudere-chat-fedora45-readonly.yml'
      - 'docs/gaudere-chat-read-only-task-lookup.md'
      - 'docs/gaudere-chat-resume-last-committed-v1.md'
      - 'src/GaudereChatInput.hpp'
      - 'docs/gaudere-chat-slash-command-routing-v1.md'
      - 'docs/gaudere-chat-preserve-task-recovery-on-invalid-reply.md'
      - 'docs/gaudere-chat-unique-report-fields-v1.md'
      - 'docs/gaudere-chat-last-verified-task-v1.md'
      - 'docs/gaudere-chat-repeat-canonical-response-v1.md'
      - 'docs/gaudere-chat-unverified-positive-commit-v1.md'
      - 'src/Makefile.am'
      - 'tests/Makefile.am'
  push:
    branches: [main]
    paths:
      - 'src/GaudereChat.hpp'
      - 'src/GaudereChat.cpp'
      - 'src/chat_main.cpp'
      - 'tests/gaudere_chat_test.cpp'
      - '.github/workflows/gaudere-chat-fedora45-readonly.yml'
      - 'docs/gaudere-chat-read-only-task-lookup.md'
      - 'docs/gaudere-chat-resume-last-committed-v1.md'
      - 'src/GaudereChatInput.hpp'
      - 'docs/gaudere-chat-slash-command-routing-v1.md'
      - 'docs/gaudere-chat-preserve-task-recovery-on-invalid-reply.md'
      - 'docs/gaudere-chat-unique-report-fields-v1.md'
      - 'docs/gaudere-chat-last-verified-task-v1.md'
      - 'docs/gaudere-chat-repeat-canonical-response-v1.md'
      - 'docs/gaudere-chat-unverified-positive-commit-v1.md'
      - 'src/Makefile.am'
      - 'tests/Makefile.am'

permissions:
  contents: read

jobs:
  fedora45-chat-unit:
    runs-on: ubuntu-latest
    container: fedora:45
    timeout-minutes: 30
    steps:
      - name: Fedora 45 build prerequisites
        run: >
          dnf install -y
          autoconf automake gcc-c++ git json-devel libcurl-devel
          libtool make pkgconf-pkg-config sqlite-devel
      - uses: actions/checkout@v4
        with:
          path: agent
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: sol-ai-agent/gaudere
          path: gaudere
          fetch-depth: 0
      - name: Build pinned Gaudere core (Fedora 45)
        shell: bash
        run: |
          set -euo pipefail
          core_ref=$(tr -d '\r\n' < agent/gaudere.ref)
          git -C gaudere checkout --detach "$core_ref"
          cd gaudere
          autoreconf --install --force
          mkdir build
          cd build
          ../configure --prefix="$GITHUB_WORKSPACE/prefix" \
            CXXFLAGS="-O2 -Wall -Wextra -Wpedantic -Werror"
          make --jobs=2
          make install
      - name: Compile gaudere-chat and test real syntax and read-only semantics
        shell: bash
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/prefix/lib/pkgconfig"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/prefix/lib"
          cd agent
          autoreconf --install --force
          mkdir build-chat
          cd build-chat
          ../configure CXXFLAGS="-O2 -Wall -Wextra -Wpedantic -Werror"
          make --jobs=2 -C src gaudere-chat
          make --jobs=2 -C tests gaudere_chat_test live_control_test
          tests/gaudere_chat_test
          tests/live_control_test
          src/gaudere-chat --help 2>&1 | grep -F '/task ID'
          src/gaudere-chat --help 2>&1 | grep -F '/wait'
          src/gaudere-chat --help 2>&1 | grep -F '/last'
          src/gaudere-chat --help 2>&1 | grep -F '/again'
          src/gaudere-chat --help 2>&1 | grep -F '//text'
          grep -Fq 'slash_command_routing_test' ../tests/gaudere_chat_test.cpp
          grep -Fq 'status_only_lookup_cannot_create_last_verified_commit_test' \
            ../tests/gaudere_chat_test.cpp
          grep -Fq 'canonical_cache_cleared_by_new_verified_commit_test' \
            ../tests/gaudere_chat_test.cpp
          grep -Fq 'mismatched_positive_commit_report_remains_ambiguous_test' \
            ../tests/gaudere_chat_test.cpp
          grep -Fq 'v2_task_id_in_conflict_is_not_v3_orphan_test' \
            ../tests/gaudere_chat_test.cpp
          grep -Fq 'zero_turn_successor_response_never_populates_cache_test' \
            ../tests/gaudere_chat_test.cpp
          grep -Fq 'submit_protocol_error_retains_exact_retry_test' \
            ../tests/gaudere_chat_test.cpp
          grep -Fq 'task_inspection_io_timeout_test' ../tests/gaudere_chat_test.cpp
          grep -Fq 'cumulative_inspection_budget_test' ../tests/gaudere_chat_test.cpp
          grep -Fq 'malformed_post_commit_observation_preserves_recovery_test' \
            ../tests/gaudere_chat_test.cpp
          grep -Fq 'malformed_unverified_commit_has_no_recovery_identity_test' \
            ../tests/gaudere_chat_test.cpp
          grep -Fq 'duplicate_head_key_rejected_before_submit_test' ../tests/gaudere_chat_test.cpp
          grep -Fq 'duplicate_commit_key_rejected_without_fake_commit_test' ../tests/gaudere_chat_test.cpp
          grep -Fq 'duplicate_task_key_rejected_with_proven_identity_test' ../tests/gaudere_chat_test.cpp
          grep -Fq 'duplicate live-control report field' ../src/GaudereChat.cpp
          grep -Fq 'do not resubmit' ../src/chat_main.cpp
          # Run the real CLI with NO socket: typos must remain purely local.
          printf '/wai\n/retry extra\n/task extra argument\n/help now\n/quit\n' |
            src/gaudere-chat --socket /nonexistent/gaudere-test.sock \
              > command-routing.out 2>&1
          test "$(grep -c 'unknown local command' command-routing.out)" = "4"
          # /last is purely local even when no live-control socket exists.
          printf '/last\n/last extra\n/quit\n' |
            src/gaudere-chat --socket /nonexistent/gaudere-test.sock \
              > local-last.out 2>&1
          grep -Fq 'no verified committed Task in this session' local-last.out
          test "$(grep -c 'unknown local command' local-last.out)" = "1"
          ! grep -E 'cannot connect|transport state is ambiguous' local-last.out
          # /again cannot open a socket, even with no prior verified reply.
          printf '/again\n/again extra\n/quit\n' |
            src/gaudere-chat --socket /nonexistent/gaudere-test.sock \
              > local-again.out 2>&1
          grep -Fq 'no canonically verified reply' local-again.out
          test "$(grep -c 'unknown local command' local-again.out)" = "1"
          ! grep -E 'cannot connect|transport state is ambiguous' local-again.out
          ! grep -E 'cannot connect|transport state is ambiguous|preferred thread advanced' command-routing.out
          grep -Fq 'LiveControlOperation::inspect_task' ../src/GaudereChat.cpp
          grep -Fq 'read_only_task_after_timeout_never_resubmits_test' \
            ../tests/gaudere_chat_test.cpp
          grep -Fq 'wait_last_committed_recovers_canonical_response_test' ../tests/gaudere_chat_test.cpp
          echo GAUDERE_CHAT_FEDORA45_READ_ONLY_RECOVERY=PASS
