name: Continuity delta checkpoint provider-free proof

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fedora-44-continuity-delta:
    runs-on: ubuntu-latest
    container: fedora:44

    steps:
      - name: Install build dependencies
        run: >
          dnf install -y
          autoconf
          automake
          gcc-c++
          git
          json-devel
          libtool
          make
          pkgconf-pkg-config
          sqlite-devel

      - uses: actions/checkout@v4
        with:
          path: agent
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: sol-ai-agent/gaudere
          path: gaudere
          fetch-depth: 0

      - name: Pin Gaudere dependency
        run: |
          set -eu
          gaudere_ref=$(tr -d '\r\n' < agent/gaudere.ref)
          case "$gaudere_ref" in
            *[!0-9a-f]*|'') exit 1 ;;
          esac
          test "${#gaudere_ref}" -eq 40
          git -C gaudere checkout --detach "$gaudere_ref"
          test "$(git -C gaudere rev-parse HEAD)" = "$gaudere_ref"

      - name: Build and install Gaudere
        run: |
          set -eu
          cd gaudere
          autoreconf --install --force
          mkdir build
          cd build
          ../configure --prefix="$GITHUB_WORKSPACE/prefix" \
            CXXFLAGS="-O2 -Wall -Wextra -Wpedantic -Werror"
          make --jobs=2 check
          make install

      - name: Prove checkpoint has no external-effect authority or service wiring
        run: |
          set -eu
          grep -q 'gaudere.continuity.delta-checkpoint.v1' \
            agent/src/ContinuityDeltaCheckpoint.hpp
          grep -q 'budget_store_.snapshot' agent/src/ContinuityDeltaCheckpoint.cpp
          grep -q 'effect_result != EffectResult::confirmed' \
            agent/src/ContinuityDeltaCheckpoint.cpp
          ! grep -Eq 'ProviderTaskHandler|OpenAIActivation|CurlHttpTransport|SecretSource|consume\(' \
            agent/src/ContinuityDeltaCheckpoint.cpp \
            agent/src/ContinuityDeltaCheckpoint.hpp
          ! grep -q 'ContinuityDeltaCheckpoint' agent/src/main.cpp
          ! grep -q 'ContinuityDeltaCheckpoint' agent/src/Makefile.am
          ! grep -R -q 'continuity.delta-checkpoint' agent/deploy/quadlet
          test "$(tr -d '\r\n' < agent/gaudere.ref)" = \
            '1316cf68db93e4c91a7bd79fbd289b8f382f8659'

      - name: Compile continuity delta checkpoint proof
        run: |
          set -eu
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/prefix/lib/pkgconfig"
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            -Iagent/src $(pkg-config --cflags gaudere-persistence-sqlite gaudere) \
            agent/tests/continuity_delta_checkpoint_test.cpp \
            agent/src/ContinuityDeltaCheckpoint.cpp \
            agent/src/AutonomousCognitionPulse.cpp \
            agent/src/AutonomousCognitionPulseStore.cpp \
            agent/src/CanonicalCognitionDecision.cpp \
            agent/src/CurrentCognitionCycle.cpp \
            agent/src/CurrentCognitionHandler.cpp \
            agent/src/CurrentCognitionTaskInspection.cpp \
            agent/src/ProviderTaskHandler.cpp \
            agent/src/ResumeAfterWakeCognition.cpp \
            agent/src/ResumeContextSnapshot.cpp \
            agent/src/ResumeContextSnapshotInspection.cpp \
            agent/src/Sha256.cpp \
            agent/src/TaskExecutor.cpp \
            $(pkg-config --libs gaudere-persistence-sqlite gaudere) -lsqlite3 \
            -o /tmp/continuity-delta-checkpoint-test

      - name: Run provider-free continuity checkpoint proof
        run: |
          set -eu
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/prefix/lib"
          /tmp/continuity-delta-checkpoint-test
