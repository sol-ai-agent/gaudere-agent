name: One-shot delete Dev-approved stale branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/delete-dev-approved-branches-once.yml

permissions:
  contents: write

jobs:
  delete-approved-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete exact Dev-approved branch list
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'agent/activate-work-loop'
            'agent/add-minimal-runtime'
            'agent/add-rootless-deployment'
            'agent/bootstrap-provider-budget'
            'agent/bound-openai-output-tokens'
            'agent/bounded-reflection-v0'
            'agent/bounded-reflection-v0-design'
            'agent/cooperative-local-wait'
            'agent/curl-http-transport'
            'agent/durable-openai-usage'
            'agent/event-driven-work-controller'
            'agent/explicit-exact-wake-v0'
            'agent/explicit-exact-wake-v0-design'
            'agent/first-authorized-openai'
            'agent/first-local-capability'
            'agent/first-production-openai-proof'
            'agent/fix-builder-image'
            'agent/fix-live-control-runtime-path'
            'agent/host-runtime-validation'
            'agent/image-provenance-v4-20260822'
            'agent/live-budget-status'
            'agent/live-control-host-validator'
            'agent/live-control-service'
            'agent/live-control-socket'
            'agent/live-control-worker'
            'agent/local-execution-boundary'
            'agent/one-worker-dispatcher'
            'agent/openai-network-probe'
            'agent/openai-responses-offline'
            'agent/operator-controls-and-cancellation'
            'agent/opt-in-openai-service'
            'agent/permanent-live-control'
            'agent/podman-secret-validation'
            'agent/provider-activation'
            'agent/provider-boundary'
            'agent/provider-budget-host-validator'
            'agent/redact-provider-errors'
            'agent/schema-v4-migration-proof'
            'agent/secret-source'
            'agent/staged-production-schema-v3'
            'agent/state-backup-validation'
            'agent/truthful-service-readiness'
            'agent/unify-gaudere-pin'
            'agent/use-sol-validation-model'
            'agent/validate-first-production-reflection'
            'agent/validate-next-production-openai'
            'agent/validate-schema-migration-copy'
            'agent/work-runtime-integration'
            'workerdev/schema-v4-staged-deploy-20260822'
            'workermax/openai-installer-schema-v4-20260822'
            'workermax/prod-schema-v4-design-20260822'
          )

          failures=0
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              if git push origin --delete "$branch"; then
                echo "deleted=$branch"
              else
                echo "::error::failed to delete $branch"
                failures=$((failures + 1))
              fi
            else
              echo "already_absent=$branch"
            fi
          done

          if (( failures != 0 )); then
            echo "::error::$failures branch deletion(s) failed"
            exit 1
          fi

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "::error::branch still exists after cleanup: $branch"
              exit 1
            fi
          done

          echo "deleted_or_already_absent=${#branches[@]}"
